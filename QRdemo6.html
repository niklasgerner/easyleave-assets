<title>Prøv selv - EasyLeave</title>

<style>
  :root {
    /* Brand palette */
    --green: #576048;
    --green-dark: #474f3a;
    --sage: #6D7A5A;
    --sage-soft: #eaece4;
    --cream: #F5F2EC;
    --beige: #E8E2D5;
    --beige-dark: #d8d1c0;
    --text: #576048;
    --text-muted: #6f7261;
    --text-soft: #8a8b7e;

    /* Card surface — tweakable */
    --card-bg: #F5F2EC;
    --card-border: rgba(45, 74, 62, 0.08);
    --qr-tile: var(--green);
    --qr-tile-border: rgba(255, 255, 255, 0.08);

    --shadow-sm: 0 1px 2px rgba(45, 74, 62, 0.05), 0 2px 10px rgba(45, 74, 62, 0.05);
    --shadow-md: 0 6px 16px rgba(45, 74, 62, 0.08), 0 16px 36px rgba(45, 74, 62, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", sans-serif !important;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap {
    max-width: 910px;
    margin: 0 auto;
    padding: 28px 24px 36px;
  }

  /* -------- Widget card (entire surface is clickable) -------- */
  .demo-card {
    display: grid;
    grid-template-columns: auto auto;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 36px 40px;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: inherit;
    transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    position: relative;
    overflow: hidden;
  }

  .demo-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: rgba(122, 158, 126, 0.4);
  }

  .demo-card:focus-visible {
    outline: 3px solid var(--sage);
    outline-offset: 3px;
  }

  /* Soft decorative arc */
  .demo-card::after {
    content: "";
    position: absolute;
    right: -120px;
    bottom: -180px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: var(--sage-soft);
    opacity: 0.55;
    pointer-events: none;
  }

  /* -------- Left column: copy + CTA -------- */
  .demo-text {
    position: relative;
    z-index: 1;
    min-width: 0;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--sage);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 5px 12px 5px 10px;
    background: var(--sage-soft);
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .eyebrow-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
    box-shadow: 0 0 0 4px rgba(122, 158, 126, 0.18);
  }

  .demo-text h2 {
    margin: 0 0 10px;
    font-size: 28px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: -0.015em;
    line-height: 1.2;
    white-space: nowrap;
  }

  .demo-text h2 .accent {
    color: var(--sage);
    font-weight: 600;
  }

  .demo-text p {
    margin: 0 0 22px;
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 400;
    max-width: none;
    white-space: nowrap;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-bottom: 22px;
  }

  .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 6px 11px 6px 9px;
    background: rgba(45, 74, 62, 0.04);
    border-radius: 999px;
  }

  .meta-chip svg {
    width: 13px;
    height: 13px;
    color: var(--sage);
  }

  .cta-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--green);
    color: var(--cream);
    padding: 12px 20px 12px 22px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.005em;
    transition: background 180ms ease, transform 180ms ease;
  }

  .demo-card:hover .cta-pill {
    background: var(--green-dark);
    transform: translateX(2px);
  }

  .cta-pill svg {
    width: 16px;
    height: 16px;
    transition: transform 220ms ease;
  }

  .demo-card:hover .cta-pill svg {
    transform: translateX(3px);
  }

  /* -------- Right column: QR tile -------- */
  .qr-tile {
    position: relative;
    z-index: 1;
    background: var(--qr-tile);
    border: 1px solid var(--qr-tile-border);
    border-radius: 18px;
    padding: 18px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 8px 24px rgba(45, 74, 62, 0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: transform 220ms ease;
  }

  .demo-card:hover .qr-tile {
    transform: scale(1.02) rotate(-1.2deg);
  }

  .qr-tile img {
    display: block;
    width: 178px;
    height: 178px;
    /* QR is white-on-transparent — sits on the green tile */
  }

  .qr-caption {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.78);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .qr-caption svg {
    width: 12px;
    height: 12px;
  }

  /* -------- Responsive -------- */
  @media (max-width: 760px) {
    .demo-card {
      grid-template-columns: 1fr;
      gap: 28px;
      padding: 28px 24px 30px;
      text-align: left;
    }
    .demo-card::after {
      width: 280px;
      height: 280px;
      right: -140px;
      bottom: -200px;
    }
    .qr-tile {
      justify-self: center;
    }
    .qr-tile img {
      width: 158px;
      height: 158px;
    }
    .demo-text h2 {
      font-size: 24px;
      white-space: normal;
    }
  }

  @media (max-width: 440px) {
    .wrap { padding: 20px 14px 28px; }
    .demo-card { padding: 24px 20px 26px; border-radius: 18px; }
    .demo-text h2 { font-size: 21px; }
    .demo-text p { font-size: 13.5px; white-space: normal; }
  }

  /* -------- Tweaks panel (only visible in design tool) -------- */
  .tweaks-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 280px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);
    padding: 18px 18px 16px;
    font-family: 'Poppins', sans-serif;
    z-index: 9999;
    display: none;
  }
  .tweaks-panel.active { display: block; }
  .tweaks-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .tweaks-panel-head h4 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: #2D4A3E;
    letter-spacing: 0.02em;
  }
  .tweaks-close {
    background: none;
    border: none;
    cursor: pointer;
    color: #888;
    padding: 4px;
    font-size: 16px;
    line-height: 1;
  }
  .tweaks-label {
    font-size: 11px;
    font-weight: 600;
    color: #6f7770;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    margin-top: 4px;
  }
  .bg-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .bg-swatch {
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 8px;
    background: #f7f5f1;
    cursor: pointer;
    transition: border-color 160ms ease, transform 120ms ease;
    font-family: inherit;
    text-align: left;
  }
  .bg-swatch:hover { transform: translateY(-1px); }
  .bg-swatch.selected { border-color: #2D4A3E; }
  .bg-swatch-preview {
    height: 24px;
    border-radius: 6px;
    margin-bottom: 6px;
    border: 1px solid rgba(45,74,62,0.08);
  }
  .bg-swatch-name {
    font-size: 11.5px;
    font-weight: 500;
    color: #2D4A3E;
  }
  .tweak-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-top: 1px solid #eee;
    font-size: 12.5px;
    color: #2D4A3E;
  }
  .tweak-row label { font-weight: 500; }
  .tweak-row select {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    color: #2D4A3E;
  }
</style>
</head>

  <!-- Tweaks panel (background + QR-tile theming) -->
  <div class="tweaks-panel" id="tweaksPanel">
    <div class="tweaks-panel-head">
      <h4>Tweaks</h4>
      <button class="tweaks-close" id="tweaksClose" aria-label="Luk">✕</button>
    </div>

    <div class="tweaks-label">Kort baggrund</div>
    <div class="bg-grid" id="bgGrid"><button class="bg-swatch"><div class="bg-swatch-preview" style="background:#ffffff"></div><div class="bg-swatch-name">Hvid</div></button><button class="bg-swatch selected"><div class="bg-swatch-preview" style="background:#F5F2EC"></div><div class="bg-swatch-name">Cream</div></button><button class="bg-swatch"><div class="bg-swatch-preview" style="background:#e8efe9"></div><div class="bg-swatch-name">Sage soft</div></button><button class="bg-swatch"><div class="bg-swatch-preview" style="background:#E8E2D5"></div><div class="bg-swatch-name">Beige</div></button><button class="bg-swatch"><div class="bg-swatch-preview" style="background:#FAFAF7"></div><div class="bg-swatch-name">Off-white</div></button><button class="bg-swatch"><div class="bg-swatch-preview" style="background:#dde7df"></div><div class="bg-swatch-name">Lys salvie</div></button></div>

    <div class="tweak-row">
      <label for="qrTileSelect">QR-flise farve</label>
      <select id="qrTileSelect">
        <option value="green">Mørkegrøn</option>
        <option value="sage">Salvie</option>
        <option value="green-dark">Skov</option>
      </select>
    </div>
  </div>

  <script>
    // ============================================================
    // TWEAKS — kortets baggrundsfarve og QR-flisens farve.
    // Persisteres via host (EDITMODE-blokken).
    // ============================================================
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "bg": 1,
      "qrTile": "green"
    }/*EDITMODE-END*/;

    const BACKGROUNDS = [
      { name: "Hvid",       value: "#ffffff", border: "rgba(45,74,62,0.08)" },
      { name: "Cream",      value: "#F5F2EC", border: "rgba(45,74,62,0.08)" },
      { name: "Sage soft",  value: "#e8efe9", border: "rgba(45,74,62,0.10)" },
      { name: "Beige",      value: "#E8E2D5", border: "rgba(45,74,62,0.10)" },
      { name: "Off-white",  value: "#FAFAF7", border: "rgba(45,74,62,0.08)" },
      { name: "Lys salvie", value: "#dde7df", border: "rgba(45,74,62,0.12)" }
    ];

    const QR_TILES = {
      "green":      "#576048",
      "sage":       "#6D7A5A",
      "green-dark": "#474f3a"
    };

    let currentTweak = Object.assign({}, TWEAK_DEFAULTS);

    function applyBackground(i) {
      const bg = BACKGROUNDS[i] || BACKGROUNDS[0];
      const root = document.documentElement;
      root.style.setProperty('--card-bg', bg.value);
      root.style.setProperty('--card-border', bg.border);
      currentTweak.bg = i;
      document.querySelectorAll('.bg-swatch').forEach(function(el, idx) {
        el.classList.toggle('selected', idx === i);
      });
    }

    function applyQrTile(key) {
      const color = QR_TILES[key] || QR_TILES.green;
      document.documentElement.style.setProperty('--qr-tile', color);
      currentTweak.qrTile = key;
      const sel = document.getElementById('qrTileSelect');
      if (sel) sel.value = key;
    }

    function buildSwatches() {
      const grid = document.getElementById('bgGrid');
      grid.innerHTML = '';
      BACKGROUNDS.forEach(function(b, i) {
        const btn = document.createElement('button');
        btn.className = 'bg-swatch' + (i === currentTweak.bg ? ' selected' : '');
        btn.innerHTML =
          '<div class="bg-swatch-preview" style="background:' + b.value + '"></div>' +
          '<div class="bg-swatch-name">' + b.name + '</div>';
        btn.addEventListener('click', function() {
          applyBackground(i);
          try {
            window.parent.postMessage({
              type: '__edit_mode_set_keys',
              edits: { bg: i }
            }, '*');
          } catch(e) {}
        });
        grid.appendChild(btn);
      });
    }

    // Init
    applyBackground(currentTweak.bg);
    applyQrTile(currentTweak.qrTile);
    buildSwatches();

    document.getElementById('qrTileSelect').addEventListener('change', function(e) {
      applyQrTile(e.target.value);
      try {
        window.parent.postMessage({
          type: '__edit_mode_set_keys',
          edits: { qrTile: e.target.value }
        }, '*');
      } catch(e) {}
    });

    // Tweaks panel host protocol
    const panel = document.getElementById('tweaksPanel');
    window.addEventListener('message', function(e) {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode')   panel.classList.add('active');
      if (d.type === '__deactivate_edit_mode') panel.classList.remove('active');
    });
    document.getElementById('tweaksClose').addEventListener('click', function() {
      panel.classList.remove('active');
      try {
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      } catch(e) {}
    });
    try {
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    } catch(e) {}
  </script>



<script>
function notifyHeight() {
  var h = document.documentElement.scrollHeight;
  try { window.parent.postMessage({ type: 'iframeHeight', height: h }, '*'); } catch(e) {}
}
window.addEventListener('load', notifyHeight);
window.addEventListener('resize', notifyHeight);
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(notifyHeight); }
</script>
