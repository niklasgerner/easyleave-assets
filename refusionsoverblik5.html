  <style>/* ═══════════════════════════════════════════════════════════════════════════
   EasyLeave — Design Tokens (CSS)
   Mirrors frontend/src/style/_design-tokens.scss. Import this file into any
   HTML prototype to get the full EasyLeave look with a single <link>.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Fonts ────────────────────────────────────────────────────────────────── */
:root {
  /* ── Brand · Olive (primary) ── */
  --el-olive: #576048;
  --el-olive-light: #6d7a5a;
  --el-olive-dark: #47503a;
  --el-olive-subtle: rgba(87, 96, 72, 0.06);
  --el-olive-hover: rgba(87, 96, 72, 0.10);
  --el-olive-active: rgba(87, 96, 72, 0.14);

  /* ── Brand · Rose ── */
  --el-rose: #99716f;
  --el-rose-dark: #725251;
  --el-rose-subtle: rgba(153, 113, 111, 0.08);

  /* ── Brand · Sand & Cream ── */
  --el-sand: #a8a396;
  --el-sand-50: #faf9f7;
  --el-cream: #efefef;

  /* ── Situation palette (mother / father × varsling / meddelelse) ── */
  --el-form-mother: #996d6f;
  --el-form-mother-dark: #724f51;
  --el-form-father: #697f58;
  --el-form-father-dark: #546447;

  /* ── Extended accent swatches used by form surfaces ── */
  --el-father: #3b7a8c;
  --el-father-dark: #2c5c6a;
  --el-father-subtle: rgba(59, 122, 140, 0.06);

  --el-maternity: #b07d95;
  --el-maternity-dark: #8f6378;
  --el-maternity-subtle: rgba(176, 125, 149, 0.06);

  --el-unpaid: #8b6e4e;
  --el-unpaid-dark: #6b5340;
  --el-unpaid-subtle: rgba(139, 110, 78, 0.06);

  --el-partial: #6a8e7f;
  --el-partial-dark: #4e6d5f;
  --el-partial-subtle: rgba(106, 142, 127, 0.06);

  --el-extended: #a07a68;
  --el-extended-dark: #846050;
  --el-extended-subtle: rgba(160, 122, 104, 0.06);

  --el-hospital: #a8635c;
  --el-hospital-dark: #8a504a;
  --el-hospital-subtle: rgba(168, 99, 92, 0.06);
  --el-hospital-border: rgba(168, 99, 92, 0.12);

  /* ── Surfaces ── */
  --el-bg: #f4f3f0;
  --el-bg-hover: #eae8e4;
  --el-card: #ffffff;
  --el-border: #e2e0db;

  /* ── Text ── */
  --el-text: #1e1e1e;
  --el-text-primary: #1e1e1e;
  --el-text-secondary: #888580;
  --el-text-muted: #b0ada8;
  --el-text-heading: #3a3835;
  --el-text-nav: #3d3b37;
  --el-text-nav-muted: #8a8780;

  --el-primary: var(--el-olive);
  --el-primary-hover: var(--el-olive-dark);

  /* ── Shadows ── */
  --el-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --el-shadow-md: 0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --el-shadow-card: 0 0 0 1px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.04);
  --el-shadow-card-hover: 0 0 0 1px rgba(87, 96, 72, 0.12), 0 8px 20px rgba(0, 0, 0, 0.07);

  /* ── Radii ── */
  --el-radius-xs: 6px;
  --el-radius-sm: 10px;
  --el-radius-md: 12px;
  --el-radius: 14px;
  --el-radius-lg: 16px;

  /* ── Layout ── */
  --el-max-w: 860px;

  /* ── Status ── */
  --el-status-pending-bg: rgba(193, 149, 50, 0.10);
  --el-status-pending-text: #9a7a20;
  --el-status-warning-bg: rgba(193, 149, 50, 0.10);
  --el-status-warning-text: #9a7a20;
  --el-status-rejected-bg: rgba(114, 82, 81, 0.12);
  --el-status-rejected-text: var(--el-rose-dark);
  --el-status-overdue-bg: rgba(114, 82, 81, 0.12);
  --el-status-overdue-text: var(--el-rose-dark);

  /* ── Semantic feedback ── */
  --el-success-bg: rgba(87, 96, 72, 0.12);
  --el-success-text: var(--el-olive-dark);
  --el-info-bg: rgba(59, 130, 246, 0.10);
  --el-info-text: #2563eb;
  --el-danger-bg: rgba(114, 82, 81, 0.14);
  --el-danger-text: var(--el-rose-dark);

  /* ── Sidebar (admin) ── */
  --el-sidebar-bg: linear-gradient(175deg, #657555 0%, #576048 30%, #47503a 100%);
  --el-sidebar-width: 260px;
  --el-sidebar-border: rgba(255, 255, 255, 0.18);
  --el-sidebar-text: #ffffff;
  --el-sidebar-text-muted: rgba(255, 255, 255, 0.60);
  --el-sidebar-active-bg: rgba(255, 255, 255, 0.12);
  --el-sidebar-active-bar: rgba(255, 255, 255, 0.60);
  --el-sidebar-hover-bg: rgba(255, 255, 255, 0.12);
  --el-sidebar-section-text: rgba(255, 255, 255, 0.60);

  --el-topbar-height: 64px;

  /* ── Typography ── */
  --el-font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Type scale (admin + portal) */
  --el-fs-display: 32px;
  --el-fs-h1: 28px;
  --el-fs-h2: 22px;
  --el-fs-h3: 18px;
  --el-fs-body: 15px;
  --el-fs-small: 13px;
  --el-fs-micro: 12px;

  --el-lh-tight: 1.2;
  --el-lh-heading: 1.3;
  --el-lh-body: 1.55;

  --el-fw-light: 300;
  --el-fw-regular: 400;
  --el-fw-medium: 500;
  --el-fw-semibold: 600;
  --el-fw-bold: 700;

  /* ── Spacing scale (4px grid) ── */
  --el-sp-1: 4px;
  --el-sp-2: 8px;
  --el-sp-3: 12px;
  --el-sp-4: 16px;
  --el-sp-5: 20px;
  --el-sp-6: 24px;
  --el-sp-8: 32px;
  --el-sp-10: 40px;
  --el-sp-12: 48px;
  --el-sp-16: 64px;

  /* Employee Portal overlays */
  --el-portal-text-on-color: #ffffff;
  --el-portal-text-on-color-muted: rgba(255, 255, 255, 0.80);
  --el-portal-overlay-light: rgba(255, 255, 255, 0.20);
  --el-portal-overlay-medium: rgba(255, 255, 255, 0.30);
}

/* ── Base semantic styles ────────────────────────────────────────────────── */
html, body {
  font-family: var(--el-font-family);
  color: var(--el-text);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: var(--el-fs-body);
  line-height: var(--el-lh-body);
}

h1, .h1 {
  font-family: var(--el-font-family);
  font-size: var(--el-fs-h1);
  line-height: var(--el-lh-heading);
  font-weight: var(--el-fw-semibold);
  color: var(--el-text-heading);
  letter-spacing: -0.01em;
  margin: 0 0 var(--el-sp-3);
}

h2, .h2 {
  font-family: var(--el-font-family);
  font-size: var(--el-fs-h2);
  line-height: var(--el-lh-heading);
  font-weight: var(--el-fw-semibold);
  color: var(--el-text-heading);
  letter-spacing: -0.005em;
  margin: 0 0 var(--el-sp-3);
}

h3, .h3 {
  font-family: var(--el-font-family);
  font-size: var(--el-fs-h3);
  line-height: var(--el-lh-heading);
  font-weight: var(--el-fw-semibold);
  color: var(--el-text-heading);
  margin: 0 0 var(--el-sp-2);
}

.display {
  font-family: var(--el-font-family);
  font-size: var(--el-fs-display);
  line-height: var(--el-lh-tight);
  font-weight: var(--el-fw-semibold);
  color: var(--el-text-heading);
  letter-spacing: -0.015em;
}

p, .body {
  font-size: var(--el-fs-body);
  line-height: var(--el-lh-body);
  color: var(--el-text);
  margin: 0 0 var(--el-sp-3);
}

.lede {
  font-size: 17px;
  line-height: 1.55;
  color: var(--el-text-secondary);
}

small, .small {
  font-size: var(--el-fs-small);
  color: var(--el-text-secondary);
}

.micro {
  font-size: var(--el-fs-micro);
  color: var(--el-text-muted);
  letter-spacing: 0.02em;
}

.eyebrow {
  font-size: var(--el-fs-micro);
  font-weight: var(--el-fw-semibold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--el-text-secondary);
}

code, .mono {
  font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace;
  font-size: 13px;
  background: var(--el-olive-subtle);
  color: var(--el-olive-dark);
  padding: 2px 6px;
  border-radius: var(--el-radius-xs);
}

  <style>/* ═══════════════════════════════════════════════════════════════════════════
   EasyLeave — Shared component styles for prototypes / preview cards.
   Layered on top of colors_and_type.css.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Material Icons Round — self-declared so no separate <link> is needed.
   The Google stylesheet is fine, but declaring it here guarantees icons
   even if the CSS request is slow or blocked. */
.material-icons-round {
  font-family: 'Material Icons Round';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'liga';
}

/* Buttons ─────────────────────────────────────────────────────────────────── */
.el-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--el-radius-sm);
  font-family: var(--el-font-family);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease,
              border-color 0.15s ease, box-shadow 0.2s ease,
              transform 0.05s ease;
  line-height: 1.2;
  white-space: nowrap;
}
.el-btn--primary {
  background: var(--el-olive);
  color: #fff;
  box-shadow: var(--el-shadow-sm);
}
.el-btn--primary:hover { background: var(--el-olive-dark); box-shadow: var(--el-shadow-md); }
.el-btn--primary:active { transform: translateY(1px); }

.el-btn--secondary {
  background: var(--el-card);
  color: var(--el-text-heading);
  border-color: var(--el-border);
}
.el-btn--secondary:hover { background: var(--el-bg-hover); border-color: #d3d0c9; }

.el-btn--ghost {
  background: transparent;
  color: var(--el-olive);
}
.el-btn--ghost:hover { background: var(--el-olive-hover); }

.el-btn--danger {
  background: var(--el-card);
  color: var(--el-rose-dark);
  border-color: color-mix(in srgb, var(--el-rose) 40%, var(--el-border));
}
.el-btn--danger:hover { background: var(--el-rose-subtle); }

.el-btn--lg { padding: 14px 24px; font-size: 15px; border-radius: var(--el-radius-md); }
.el-btn--sm { padding: 6px 12px; font-size: 13px; }
.el-btn .material-icons-round { font-size: 18px; }

/* Inputs ──────────────────────────────────────────────────────────────────── */
.el-field { display: flex; flex-direction: column; gap: 6px; }
.el-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--el-text-heading);
  letter-spacing: 0.01em;
}
.el-input, .el-textarea, .el-select {
  font-family: var(--el-font-family);
  font-size: 14px;
  padding: 11px 14px;
  background: var(--el-card);
  color: var(--el-text);
  border: 1px solid var(--el-border);
  border-radius: var(--el-radius-sm);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.el-input:hover, .el-textarea:hover, .el-select:hover {
  border-color: #d3d0c9;
}
.el-input:focus, .el-textarea:focus, .el-select:focus {
  border-color: var(--el-olive);
  box-shadow: 0 0 0 3px var(--el-olive-subtle);
}
.el-input::placeholder { color: var(--el-text-muted); }
.el-input[disabled] { background: var(--el-bg); color: var(--el-text-muted); cursor: not-allowed; }
.el-help { font-size: 12px; color: var(--el-text-secondary); }
.el-error { font-size: 12px; color: var(--el-rose-dark); }

/* Select chevron */
.el-select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%23888580' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 36px;
}

/* Cards ───────────────────────────────────────────────────────────────────── */
.el-card {
  background: var(--el-card);
  border-radius: var(--el-radius-lg);
  box-shadow: var(--el-shadow-card);
  padding: 24px;
  border: 1px solid transparent;
}
.el-card--bordered { border-color: var(--el-border); box-shadow: none; }
.el-card--hover { transition: box-shadow 0.2s ease, transform 0.2s ease; }
.el-card--hover:hover { box-shadow: var(--el-shadow-card-hover); }

/* Chips / pills ───────────────────────────────────────────────────────────── */
.el-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.01em;
}
.el-chip--neutral { background: var(--el-olive-subtle); color: var(--el-olive-dark); }
.el-chip--pending { background: var(--el-status-pending-bg); color: var(--el-status-pending-text); }
.el-chip--overdue { background: var(--el-status-overdue-bg); color: var(--el-status-overdue-text); }
.el-chip--success { background: var(--el-success-bg); color: var(--el-success-text); }
.el-chip--info { background: var(--el-info-bg); color: var(--el-info-text); }
.el-chip--mother { background: color-mix(in srgb, var(--el-form-mother) 12%, transparent); color: var(--el-form-mother-dark); }
.el-chip--father { background: color-mix(in srgb, var(--el-form-father) 14%, transparent); color: var(--el-form-father-dark); }
.el-chip .material-icons-round { font-size: 14px; }

/* Info box (reassuring explanatory surface used in guided flow) */
.el-info-box {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--el-radius-md);
  background: var(--el-olive-subtle);
  color: var(--el-text);
  align-items: flex-start;
}
.el-info-box .material-icons-round {
  color: var(--el-olive);
  font-size: 20px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Switch */
.el-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  flex-shrink: 0;
}
.el-switch input { opacity: 0; width: 0; height: 0; }
.el-switch__slider {
  position: absolute; inset: 0;
  background: #c9c6c1;
  border-radius: 999px;
  transition: background 0.2s ease;
  cursor: pointer;
}
.el-switch__slider::before {
  content: "";
  position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  transition: transform 0.2s ease;
}
.el-switch input:checked + .el-switch__slider { background: var(--el-olive); }
.el-switch input:checked + .el-switch__slider::before { transform: translateX(18px); }

/* Focus ring (accessibility) */
:focus-visible {
  outline: 2px solid var(--el-olive);
  outline-offset: 2px;
}

/* Preview card frame used inside the Design System tab */
.ds-card {
  font-family: var(--el-font-family);
  background: var(--el-card);
  color: var(--el-text);
  box-sizing: border-box;
  padding: 20px;
}
.ds-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ds-grid { display: grid; gap: 12px; }
.ds-swatch {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  color: var(--el-text-secondary);
}
.ds-swatch__chip {
  height: 56px;
  border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.04);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
}
.ds-swatch__name { color: var(--el-text-heading); font-weight: 500; font-size: 12px; }
.ds-swatch__hex { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
</style>

  <script type="text/babel">


const { useState } = React;

/* ─── Konstanter ─────────────────────────────────────────────── */
const UD_RATE = 137.43; // Udbetaling Danmark, kr./time
const UD_MAX = 37; // Loft: refusion fra UD i maks 37 uger
const FERIE_PCT = 0.125; // Feriepenge — 12,5% af månedsløn
const MONTH_WEEKS = 4.33; // Uger pr. måned (omregning til timeløn)

// Barsel.dk
const BDK_RATE = 102.92; // tillæg, kr./time
const BDK_RESERVED = 7; // reserverede uger (begge forældre)
const BDK_DELEUGER = 24; // deleuger — maksimalt

// DA Barsel
const DA_RATE = 119.63; // tillæg, kr./time
const DA_RESERVED_MOR = 19; // reserverede uger (mor)
const DA_RESERVED_FAR = 12; // reserverede uger (far/medmor)
const DA_DELEUGER = 7; // deleuger — fælles, first come first served

/* ─── Hjælpefunktioner ───────────────────────────────────────── */
function fmtKr(n) {
  if (isNaN(n) || !isFinite(n)) return '— kr.';
  if (n < 0) return '−' + fmtKr(-n);
  const s = Math.round(n).toString();
  let out = '';
  for (let i = 0; i < s.length; i++) {
    if (i > 0 && (s.length - i) % 3 === 0) out += '.';
    out += s[i];
  }
  return out + ' kr.';
}
function fmtRate(n) {return n.toFixed(2).replace('.', ',');}
function fmtNum(n) {return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');}

/* ─── Beregning (generisk — Barsel.dk + DA Barsel) ───────────── */
function beregn({ manedslon, pensionPct, timer, uger, fondRate, fondReserved, fondDeleuger }) {
  const feriepenge = manedslon * FERIE_PCT;
  const pension = manedslon * (pensionPct / 100);
  const omkPrTime = (manedslon + feriepenge + pension) / (timer * MONTH_WEEKS);

  // Effektive satser — refusion kan aldrig overskride faktisk omkostning pr. time
  const effUdRate   = Math.min(UD_RATE, omkPrTime);
  const effFondRate = Math.max(0, Math.min(fondRate, omkPrTime - effUdRate));

  // Lønomkostning — alle ugers orlov med løn
  const lonOmk = omkPrTime * timer * uger;

  // Refusion fra Udbetaling Danmark — alle uger op til loftet (37)
  const udUger = Math.min(uger, UD_MAX);
  const udRefusion = effUdRate * timer * udUger;

  // Barselsfond — reserverede uger
  const resUger = Math.min(uger, fondReserved);
  const resRefusion = effFondRate * timer * resUger;

  // Minimum-scenarie: sikker refusion (UD + reserverede uger)
  const minRefusion = udRefusion + resRefusion;
  const omkEfterMin = lonOmk - minRefusion;

  // Barselsfond — deleuger (uger ud over reserverede, op til fondDeleuger)
  const delUger = Math.min(Math.max(uger - fondReserved, 0), fondDeleuger);
  const delRefusion = effFondRate * timer * delUger;

  // Bedste tilfælde: minimum + deleuger
  const bedsteRefusion = minRefusion + delRefusion;
  const omkBedste = omkEfterMin - delRefusion;

  // Uger der hverken er reserveret eller falder inden deleuge-loftet
  const udenFondUger = Math.max(uger - resUger - delUger, 0);

  const warnings = [];
  if (omkPrTime < UD_RATE - 0.01)
    warnings.push(`Omkostning pr. time (${fmtRate(omkPrTime)} kr.) er under Udbetaling Danmarks maks-sats — UD-refusion begrænses til den faktiske omkostning. Ingen tillæg fra barselsfonden.`);
  else if (effFondRate < fondRate - 0.01)
    warnings.push(`Barselsfond-tillæg reduceret til ${fmtRate(effFondRate)} kr./time — samlet refusion må ikke overstige omkostningen pr. time (${fmtRate(omkPrTime)} kr.).`);
  if (uger > UD_MAX)
    warnings.push(`Refusion fra Udbetaling Danmark er begrænset til de første ${UD_MAX} uger — uger derudover får ingen UD-refusion.`);
  if (uger > fondReserved + fondDeleuger)
    warnings.push(`Barselsfonden dækker maks ${fondReserved + fondDeleuger} uger (${fondReserved} reserverede + ${fondDeleuger} deleuger). Uger derudover får intet tillæg.`);

  return {
    feriepenge, pension, omkPrTime,
    effUdRate, effFondRate,
    fondRate, fondReserved, fondDeleuger,
    lonOmk,
    udUger, udRefusion,
    resUger, resRefusion,
    minRefusion, omkEfterMin,
    delUger, delRefusion,
    bedsteRefusion, omkBedste,
    udenFondUger, warnings
  };
}

/* ─── Tal-input (kr. / md) ───────────────────────────────────── */
function MoneyInput({ label, value, onChange, suffix }) {
  // Tusind-separator (dansk: punktum) på ren ciffer-streng
  const grp = (digits) => digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const [raw, setRaw] = React.useState(
    value !== null && value !== undefined ? grp(String(value)) : ''
  );

  // Hold feltet i sync når værdien nulstilles udefra
  React.useEffect(() => {
    if (value === null || value === undefined) setRaw('');
  }, [value]);

  const handleChange = (e) => {
    // Behold kun cifre, fjern førende nuller
    const digits = e.target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    if (digits === '') { setRaw(''); onChange(null); return; }   // slettes alt → tomt
    setRaw(grp(digits));
    onChange(parseInt(digits, 10));
  };

  return (
    <div className="el-field" style={{ flex: 1, minWidth: 0 }}>
      <label className="el-label">{label}</label>
      <div style={{ display: 'flex', alignItems: 'center', height: 42, border: '1px solid var(--el-border)', borderRadius: 10, background: '#fff', overflow: 'hidden' }}>
        <input type="text" inputMode="numeric" value={raw} placeholder="0"
          onChange={handleChange}
          style={{ flex: 1, height: '100%', border: 'none', padding: '0 12px', fontSize: 16, fontWeight: 600, fontFamily: 'var(--el-font-family)', color: 'var(--el-text-heading)', outline: 'none', background: 'transparent', minWidth: 0 }} />
        <span style={{ padding: '0 12px 0 0', fontSize: 12, color: 'var(--el-text-muted)', flexShrink: 0, whiteSpace: 'nowrap' }}>{suffix}</span>
      </div>
    </div>
  );
}

/* ─── Stepper ────────────────────────────────────────────────── */
function Stepper({ label, value, onChange, min = 0, max = 52, suffix, step = 1, decimals = 0, forceDecimals = false }) {
  const fmtDisp = (v) => {
    if (v === null || v === undefined) return '';
    if (forceDecimals && decimals > 0) return v.toFixed(decimals).replace('.', ',');
    if (Number.isInteger(v)) return String(v);
    return String(+v.toFixed(decimals > 0 ? decimals : 2)).replace('.', ',');
  };

  const [raw, setRaw] = React.useState(fmtDisp(value));
  const [focused, setFocused] = React.useState(false);

  // Sync med ydre værdi når feltet ikke er i fokus (fx +/- eller nulstilling)
  React.useEffect(() => {
    if (!focused) setRaw(fmtDisp(value));
  }, [value, focused]);

  const handleChange = (e) => {
    // Tillad cifre, komma og punktum mens der skrives — ingen clamp endnu
    const s = e.target.value.replace(/[^\d.,]/g, '');
    setRaw(s);
    if (s === '') { onChange(null); return; }              // slettes alt → tomt
    const v = parseFloat(s.replace(',', '.'));
    if (!isNaN(v)) onChange(v);
  };

  const handleBlur = () => {
    setFocused(false);
    if (raw.trim() === '') { onChange(null); setRaw(''); return; }
    let v = parseFloat(raw.replace(',', '.'));
    if (isNaN(v)) { onChange(null); setRaw(''); return; }
    v = Math.min(max, Math.max(min, v));                   // clamp ved blur
    if (step < 1) v = Math.round(v / step) * step;         // snap til halve
    else if (decimals === 0) v = Math.round(v);
    v = +v.toFixed(2);
    onChange(v);
    setRaw(fmtDisp(v));
  };

  const stepTo = (delta) => {
    const base = value ?? min;
    const next = Math.min(max, Math.max(min, +(base + delta).toFixed(2)));
    onChange(next);
  };

  const btnStyle = {
    width: 34, height: 42, border: 'none',
    background: 'var(--el-bg)', cursor: 'pointer', fontSize: 18,
    lineHeight: 1, color: 'var(--el-text-secondary)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    transition: 'background .1s', userSelect: 'none', flexShrink: 0
  };
  return (
    <div className="el-field" style={{ flex: 1, minWidth: 0 }}>
      {label && <label className="el-label">{label}</label>}
      <div style={{ display: 'flex', alignItems: 'center', height: 42, border: '1px solid var(--el-border)', borderRadius: 10, background: '#fff', overflow: 'hidden' }}>
        <button type="button" className="stepper-btn" style={{ ...btnStyle, borderRight: '1px solid var(--el-border)', borderRadius: 0 }}
          onClick={() => stepTo(-step)}>−</button>
        <input type="text" inputMode="decimal" value={raw}
          onFocus={() => setFocused(true)}
          onChange={handleChange}
          onBlur={handleBlur}
          style={{ flex: 1, height: '100%', border: 'none', minWidth: 0, textAlign: 'center', fontSize: 16, fontWeight: 600, fontFamily: 'var(--el-font-family)', color: 'var(--el-text-heading)', outline: 'none', background: 'transparent' }} />
        <button type="button" className="stepper-btn" style={{ ...btnStyle, borderLeft: '1px solid var(--el-border)', borderRight: '1px solid var(--el-border)', borderRadius: 0 }}
          onClick={() => stepTo(step)}>+</button>
        {suffix && <span style={{ padding: '0 10px', fontSize: 11, color: 'var(--el-text-muted)', flexShrink: 0, whiteSpace: 'nowrap', background: 'var(--el-bg)', height: '100%', display: 'flex', alignItems: 'center', borderLeft: 'none', width: "45px", textAlign: "left", justifyContent: "center" }}>{suffix}</span>}
      </div>
    </div>);

}

            <LineRow label="Omkostning til løn under orlov efter minimum-refusion" sub="Den udgift I som minimum kan regne med" kr={r.omkEfterMin} strong />

            <div style={{ height: 18 }}></div>

            <div style={{ fontSize: 11, color: 'var(--el-text-muted)', fontWeight: 600, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.06em' }}>YDERLIGERE REFUSION, HVIS DELEUGERNE OGSÅ OPNÅS

            </div>
            <div style={{ display: 'flex', gap: 10, padding: '10px 14px', background: 'rgba(153,109,111,0.06)', borderRadius: 'var(--el-radius-md)', marginBottom: 4 }}>
              <span className="material-icons-round" style={{ fontSize: 15, color: 'var(--el-form-mother)', flexShrink: 0, marginTop: 1 }}>info</span>
              <p style={{ margin: 0, fontSize: 11.5, color: 'var(--el-form-mother-dark)', lineHeight: 1.55 }}>
                De {r.fondDeleuger} deleuger er ikke reserveret til {roleLabel.toLowerCase()} specifikt. De tilfalder den forælder der afholder dem først.
              </p>
            </div>
            <LineRow label={`${fondLabel} — deleuger`} sub={`${fmtRate(r.effFondRate)} kr./time × ${timer} timer × ${fmtNum(r.delUger)} uger (maks ${r.fondDeleuger})${r.effFondRate < r.fondRate ? ` (begrænset fra ${fmtRate(r.fondRate)} kr./time)` : ''}`} kr={r.delRefusion} minus />
            <LineRow label="Omkostning til løn i bedste tilfælde" sub={`Hvis ${roleLabel.toLowerCase()} afholder deleugerne først`} kr={r.omkBedste} strong />
          </div>

          {/* To scenarier */}
          <div className="el-scenario-grid" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <ScenarioCard
              tag="Minimum" tagTone="neutral"
              title="Sikker refusion"
              sub={`Udbetaling Danmark + de reserverede uger fra ${fondLabel}. Det I som minimum får dækket.`}
              omkostning={r.omkEfterMin}
              refusion={r.minRefusion}
              refusionLabel="Refusion i alt" />
            <ScenarioCard
              tag="Bedste tilfælde" tagTone="mother"
              title="Med deleuger"
              sub={`Hvis ${roleLabel.toLowerCase()} også afholder deleugerne, dækker ${fondLabel} yderligere uger.`}
              omkostning={r.omkBedste}
              refusion={r.bedsteRefusion}
              refusionLabel="Refusion i alt"
              highlight />
          </div>


          {/* Footer-note */}
          <div style={{ marginTop: 16, padding: '13px 18px', borderRadius: 'var(--el-radius-md)', background: 'var(--el-card)', border: '1px solid var(--el-border)', fontSize: 11, color: 'var(--el-text-muted)', lineHeight: 1.8 }}>
            <strong style={{ color: 'var(--el-text-secondary)' }}>Vejledende beregning.</strong>{'  '}
            Søg altid råd og vejledning ved Udbetaling Danmark og din barselsfond.
          </div>
          </div>}
        </div>}

      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);

  <script>
    (function () {
      var lastH = 0, typing = false, raf = null;

      function measure() {
        // Mål kun indholdets faktiske højde — ikke html/iframens viewport,
        // som ellers låser højden fast for stor (luft i bunden).
        return Math.ceil(document.body.getBoundingClientRect().height);
      }
      function post(h) {
        // Send i flere formater så enhver eksisterende parent-listener fanger én af dem
        parent.postMessage({ iframeHeight: h, type: 'easyleave:height', id: 'refusionsoverblik', height: h, frameHeight: h }, '*');
        parent.postMessage({ type: 'resize', height: h }, '*');
      }
      function update(force) {
        var h = measure();
        if (!force && h === lastH) return;   // kun ved reel ændring
        if (typing && h < lastH) return;     // undgå at krympe mens der skrives (hopper fokus på mobil)
        lastH = h;
        post(h);
      }
      function schedule() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () { update(false); });
      }

      // Marker at brugeren er i et felt — men bloker kun krymp, ikke vækst
      document.addEventListener('focusin', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) typing = true;
      });
      document.addEventListener('focusout', function () {
        typing = false;
        setTimeout(function () { update(false); }, 80);
      });
      // Genmål når en ny sektion folder sig ud (reveal-animationen ændrer højde over tid)
      document.addEventListener('animationend', schedule);
      document.addEventListener('transitionend', schedule);

      window.addEventListener('load', function () { update(true); });
      window.addEventListener('resize', schedule);
      if (window.ResizeObserver) {
        new ResizeObserver(schedule).observe(document.body);
      }
      // Sikkerhedsnet: gentagne tidlige udsendelser fanger font-reflow + sen mount
      [60, 200, 500, 1000, 2000].forEach(function (t) { setTimeout(function () { update(true); }, t); });
      setInterval(function () { update(false); }, 400);
      // Genmål når webfonts er klar (ændrer ofte højden på overskriften)
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { update(true); });
    })();
  </script>
