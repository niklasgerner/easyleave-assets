<!DOCTYPE html>

<html lang="da"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyLeave – Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-green: #576048;
    --sage: #869375;
    --mauve: #99716f;
    --taupe: #c4b8a4;
    --charcoal: #3a3835;
    --muted: #888580;
    --off-white: #f4f3f0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow-x: hidden;
  }

  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .stage {
    position: relative;
    width: 100%;
    min-height: 0;
    padding: clamp(16px, 3vw, 32px) clamp(16px, 2.5vw, 32px) clamp(16px, 3vw, 32px) 0;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    overflow: hidden;
  }

  .content {
    position: relative;
    z-index: 2;
    max-width: 660px;
    width: 100%;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 20px 0;
    line-height: 1.4;
  }

  .eyebrow::before {
    content: "";
    width: 22px;
    height: 2px;
    background: var(--sage);
    flex: 0 0 auto;
  }

  .headline {
    font-size: clamp(3.6rem, 7.5vw, 6.2rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 0.98;
    color: var(--charcoal);
    margin: 0 0 28px 0;
  }

  .headline .line1 {
    display: block;
  }

  .headline .accent {
    display: block;
    color: var(--dark-green);
  }

  .subcopy {
    font-size: clamp(18px, 1.6vw, 21px);
    line-height: 1.65;
    color: var(--muted);
    font-weight: 400;
    margin: 0 0 40px 0;
    max-width: 46ch;
    text-wrap: pretty;
  }

  .subcopy strong {
    color: var(--charcoal);
    font-weight: 600;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 20px 44px;
    min-height: 60px;
    background: var(--dark-green);
    color: #ffffff;
    text-decoration: none;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(87, 96, 72, 0.3);
    transition: transform 220ms cubic-bezier(.2,.7,.2,1),
                box-shadow 220ms cubic-bezier(.2,.7,.2,1),
                background-color 220ms ease;
    will-change: transform;
  }

  .cta:hover {
    background: #474f3a;
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(87, 96, 72, 0.38);
  }

  .cta:active {
    transform: translateY(0);
    box-shadow: 0 8px 22px rgba(87, 96, 72, 0.3);
  }

  .cta:focus-visible {
    outline: 2px solid var(--dark-green);
    outline-offset: 3px;
  }

  .cta .arrow {
    display: inline-block;
    transition: transform 220ms cubic-bezier(.2,.7,.2,1);
    font-weight: 600;
  }

  .cta:hover .arrow {
    transform: translateX(4px);
  }

  /* Mobile */
  @media (max-width: 560px) {
    .stage {
      justify-content: flex-start;
      text-align: left;
      padding: 0 16px 16px 16px;
      min-height: 0;
    }
    .content {
      max-width: 100%;
      text-align: left;
    }
    .headline,
    .subcopy {
      text-align: left;
    }
    .subcopy {
      margin-left: 0;
      margin-right: 0;
      max-width: 100%;
    }
    .headline {
      font-size: clamp(2.8rem, 15vw, 4.2rem);
      letter-spacing: -0.025em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta, .cta .arrow {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <section class="stage" aria-label="EasyLeave hero">
    <div class="content">
      <h1 class="headline">
        <span class="line1">Barsel.</span>
        <span class="accent">Nemt.</span>
      </h1>
      <p class="subcopy">
        EasyLeave gør orlov til en god oplevelse for medarbejderen, frigør tid i organisationen og sikrer de data, der skal til for at løfte jeres refusionsgrundlag.
      </p>
      <a class="cta" href="https://easyleave.dk/produkt" target="_top" rel="noopener">
        Se løsningen
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>

<script>
function sendHeight() {
  var h = document.body.scrollHeight;
  window.parent.postMessage({ iframeHeight: h }, '*');
}
window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
if (document.fonts) { document.fonts.ready.then(sendHeight); }
</script>


</body></html>
