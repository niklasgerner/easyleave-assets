  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"173cd504-97ec-4a44-bcd4-a2a3b46292d5\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ═══════════════════════════════════════════════════════════════════════════\n   EasyLeave Design System — Colors + Typography + Primitives\n   Source of truth mirrors frontend/src/style/_design-tokens.scss and _fonts.scss.\n   Use --el-* variables; don't hard-code colors. Poppins is the primary face.\n   ═══════════════════════════════════════════════════════════════════════════ */\n\n/* ───────────────── POPPINS (primary face, self-hosted) ───────────────── */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"88abf0d3-655f-432c-86e7-6c2b3efae152\") format('woff2'),\n       url(\"a4bf732e-d409-4b92-8c3a-4ef3cb0ffd5c\") format('woff2');\n}\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b8c40290-aacc-45a3-9be2-4329877d70c5\") format('woff2'),\n       url(\"5226dd85-7dd2-4986-9d4e-e993d6d9d682\") format('woff2');\n}\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"bbd14804-226a-4b7a-9c0f-ad68254c1747\") format('woff2'),\n       url(\"45d3e6a1-f981-4a2f-a00c-ed9882ce017d\") format('woff2');\n}\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"83a54dbd-451c-48c1-93c0-72c1d3952be7\") format('woff2'),\n       url(\"816b6d4b-68a8-4190-9424-bc5eefae6efe\") format('woff2');\n}\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e1454ab8-27dd-4a6d-8fea-52e5f232b31a\") format('woff2'),\n       url(\"6d8c767b-5e56-4765-9b9b-179d59abeca8\") format('woff2');\n}\n\n:root {\n  /* ──────────── Brand: Olive (primary) ──────────── */\n  --el-olive: #576048;\n  --el-olive-light: #6d7a5a;\n  --el-olive-dark: #47503a;\n  --el-olive-subtle: rgba(87, 96, 72, 0.06);\n  --el-olive-hover: rgba(87, 96, 72, 0.10);\n  --el-olive-active: rgba(87, 96, 72, 0.14);\n\n  /* ──────────── Brand: Rose (warm secondary / destructive tint) ──────────── */\n  --el-rose: #99716f;\n  --el-rose-dark: #725251;\n  --el-rose-subtle: rgba(153, 113, 111, 0.08);\n\n  /* ──────────── Brand: Sand + Cream (neutrals) ──────────── */\n  --el-sand: #a8a396;\n  --el-sand-50: #faf9f7;\n  --el-cream: #efefef;\n\n  /* ──────────── Form-situation accents (mother / father / states) ──────────── */\n  --el-form-mother: #996d6f;       /* Mor — varsling (not-born) */\n  --el-form-mother-dark: #724f51;  /* Mor — meddelelse (born) */\n  --el-form-father: #697f58;       /* Far — varsling (not-born) */\n  --el-form-father-dark: #546447;  /* Far — meddelelse (born) */\n\n  --el-father: #3b7a8c;            /* Medmor/father portal accent */\n  --el-father-dark: #2c5c6a;\n  --el-father-subtle: rgba(59, 122, 140, 0.06);\n\n  --el-maternity: #b07d95;\n  --el-maternity-dark: #8f6378;\n  --el-maternity-subtle: rgba(176, 125, 149, 0.06);\n\n  --el-unpaid: #8b6e4e;\n  --el-unpaid-dark: #6b5340;\n  --el-unpaid-subtle: rgba(139, 110, 78, 0.06);\n\n  --el-partial: #6a8e7f;\n  --el-partial-dark: #4e6d5f;\n  --el-partial-subtle: rgba(106, 142, 127, 0.06);\n\n  --el-extended: #a07a68;\n  --el-extended-dark: #846050;\n  --el-extended-subtle: rgba(160, 122, 104, 0.06);\n\n  --el-hospital: #a8635c;\n  --el-hospital-dark: #8a504a;\n  --el-hospital-subtle: rgba(168, 99, 92, 0.06);\n  --el-hospital-border: rgba(168, 99, 92, 0.12);\n\n  /* ──────────── Surfaces ──────────── */\n  --el-bg: #f4f3f0;\n  --el-bg-hover: #eae8e4;\n  --el-card: #ffffff;\n  --el-card-bg: #ffffff;\n  --el-border: #e2e0db;\n\n  /* ──────────── Foreground / text ──────────── */\n  --el-text: #1e1e1e;\n  --el-text-primary: #1e1e1e;\n  --el-text-secondary: #888580;\n  --el-text-muted: #b0ada8;\n  --el-text-heading: #3a3835;\n  --el-text-nav: #3d3b37;\n  --el-text-nav-muted: #8a8780;\n\n  /* Semantic aliases (fg1/fg2/etc) */\n  --el-fg1: var(--el-text-primary);\n  --el-fg2: var(--el-text-heading);\n  --el-fg3: var(--el-text-secondary);\n  --el-fg4: var(--el-text-muted);\n\n  /* ──────────── Primary action ──────────── */\n  --el-primary: var(--el-olive);\n  --el-primary-hover: var(--el-olive-dark);\n\n  /* ──────────── Shadows ──────────── */\n  --el-shadow-sm:        0 1px 2px rgba(0, 0, 0, 0.04);\n  --el-shadow-md:        0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);\n  --el-shadow-card:      0 0 0 1px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.04);\n  --el-shadow-card-hover:0 0 0 1px rgba(87, 96, 72, 0.12), 0 8px 20px rgba(0, 0, 0, 0.07);\n\n  /* ──────────── Radii ──────────── */\n  --el-radius: 14px;\n  --el-radius-xs: 6px;\n  --el-radius-sm: 10px;\n  --el-radius-md: 12px;\n  --el-radius-lg: 16px;\n\n  /* ──────────── Layout ──────────── */\n  --el-max-w: 860px;\n  --el-sidebar-width: 260px;\n  --el-topbar-height: 64px;\n\n  /* ──────────── Status chips (form queue + state) ──────────── */\n  --el-status-pending-bg:   rgba(193, 149, 50, 0.10);\n  --el-status-pending-text: #9a7a20;\n  --el-status-warning-bg:   rgba(193, 149, 50, 0.10);\n  --el-status-warning-text: #9a7a20;\n  --el-status-rejected-bg:  rgba(114, 82, 81, 0.12);\n  --el-status-rejected-text:var(--el-rose-dark);\n  --el-status-overdue-bg:   rgba(114, 82, 81, 0.12);\n  --el-status-overdue-text: var(--el-rose-dark);\n\n  --el-success-bg:  rgba(87, 96, 72, 0.12);\n  --el-success-text:var(--el-olive-dark);\n  --el-info-bg:     rgba(59, 130, 246, 0.10);\n  --el-info-text:   #2563eb;\n  --el-danger-bg:   rgba(114, 82, 81, 0.14);\n  --el-danger-text: var(--el-rose-dark);\n\n  --el-state-red:      #d9382a;  --el-state-red-bg:    #fdecea;\n  --el-state-yellow:   #b7791f;  --el-state-yellow-bg: #fef5e7;\n  --el-state-green:    #2f855a;  --el-state-green-bg:  #eaf7ee;\n  --el-state-gray:     #4a5568;  --el-state-gray-bg:   #edf2f7;\n\n  /* ──────────── Sidebar (dark olive gradient shell) ──────────── */\n  --el-sidebar-bg:          linear-gradient(175deg, #657555 0%, #576048 30%, #47503a 100%);\n  --el-sidebar-border:      rgba(255, 255, 255, 0.18);\n  --el-sidebar-text:        #ffffff;\n  --el-sidebar-text-muted:  rgba(255, 255, 255, 0.60);\n  --el-sidebar-active-bg:   rgba(255, 255, 255, 0.12);\n  --el-sidebar-active-bar:  rgba(255, 255, 255, 0.60);\n  --el-sidebar-hover-bg:    rgba(255, 255, 255, 0.12);\n  --el-sidebar-section-text:rgba(255, 255, 255, 0.60);\n\n  /* ──────────── Typography ──────────── */\n  --el-font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* Display / heading scale (Poppins, tight tracking) */\n  --el-type-display:  700 32px/1.12 var(--el-font-family);   /* letter-spacing: -0.02em */\n  --el-type-h1:       700 26px/1.2  var(--el-font-family);\n  --el-type-h2:       700 20px/1.3  var(--el-font-family);\n  --el-type-h3:       600 16px/1.35 var(--el-font-family);\n  --el-type-h4:       600 14px/1.4  var(--el-font-family);\n  --el-type-body:     400 14px/1.5  var(--el-font-family);\n  --el-type-body-sm:  400 13px/1.5  var(--el-font-family);\n  --el-type-label:    600 12.5px/1.35 var(--el-font-family); /* form field labels */\n  --el-type-eyebrow:  700 11px/1 var(--el-font-family);      /* letter-spacing: 0.08em, upper */\n  --el-type-caption:  500 11.5px/1.4 var(--el-font-family);\n  --el-type-btn:      600 13.5px/1 var(--el-font-family);\n  --el-type-nav:      500 13.5px/1 var(--el-font-family);\n}\n\n/* ═══════════════════ SEMANTIC ELEMENTS ═══════════════════ */\n.el-body,\nbody.el-body {\n  font: var(--el-type-body);\n  color: var(--el-text-primary);\n  background: var(--el-bg);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1.el, .el h1 {\n  font: var(--el-type-display);\n  letter-spacing: -0.02em;\n  color: var(--el-text);\n  margin: 0 0 8px;\n}\nh2.el, .el h2 {\n  font: var(--el-type-h1);\n  color: var(--el-text-heading);\n  margin: 0 0 6px;\n}\nh3.el, .el h3 {\n  font: var(--el-type-h2);\n  color: var(--el-text-heading);\n  margin: 0 0 6px;\n}\nh4.el, .el h4 {\n  font: var(--el-type-h3);\n  color: var(--el-text-heading);\n  margin: 0 0 4px;\n}\np.el, .el p  { font: var(--el-type-body); color: var(--el-text-primary); margin: 0 0 8px; }\n.el-eyebrow  { font: var(--el-type-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--el-text-muted); }\n.el-caption  { font: var(--el-type-caption); color: var(--el-text-secondary); }\n.el-label    { font: var(--el-type-label); color: var(--el-text-heading); }\n\ncode.el, .el code, .el-mono {\n  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  font-size: 12.5px;\n  background: var(--el-olive-subtle);\n  color: var(--el-olive-dark);\n  padding: 1px 6px;\n  border-radius: 4px;\n}\n<\u002Fstyle>\n<style>\nhtml,body{overflow-anchor:none}\nbody{margin:0;background:#eae8e2;font:400 14px/1.5 'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e1e1e;-webkit-font-smoothing:antialiased}\na{color:#576048}\na:hover{color:#47503a}\ninput,textarea,select,button{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}\ninput[type=radio],input[type=checkbox]{accent-color:#576048}\n@keyframes elwbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.elwb-print{display:none}\n.elwb-mobile-only{display:none}\n@media (max-width:640px){.elwb-mobile-only{display:block}}\n@media print{\n  html,body{background:#fff}\n  .elwb-screen{display:none !important}\n  .elwb-print{display:block !important}\n  @page{size:A4;margin:15mm 15mm 18mm}\n  .elwb-page{break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}\n  .elwb-page:last-child{break-after:auto;page-break-after:auto}\n  .elwb-keep{break-inside:avoid;page-break-inside:avoid}\n  .elwb-h{break-after:avoid;page-break-after:avoid}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#eae8e2\">\n\n<div class=\"elwb-screen\">\n\n<sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:sticky;top:0;z-index:30;background:rgba(234,232,226,.95);backdrop-filter:blur(10px);border-bottom:1px solid #d9d6ce\">\n    <div style=\"max-width:908px;margin:0 auto;padding:14px 24px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 9px\">\n        <span style=\"font:700 11px/1 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#576048\">{{ stepLabel }}<\u002Fspan>\n        <span style=\"font:600 13.5px/1.35 'Poppins',sans-serif;color:#3a3835\">{{ stepName }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:5px;background:#d5d2c9;border-radius:999px;overflow:hidden\">\n        <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"max-width:880px;margin:0 auto;padding:32px 24px 80px\">\n\n<sc-if value=\"{{ isStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"00 Velkomst\" style=\"animation:elwbIn .24s ease-out\">\n  <div style=\"background:linear-gradient(160deg,#6d7a5a 0%,#576048 52%,#47503a 100%);border-radius:18px;padding:40px 38px;margin:0 0 22px\">\n    <p style=\"font:700 11.5px/1 'Poppins',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 16px\">Onboarding-workbook<\u002Fp>\n    <h1 style=\"font:700 40px/1.1 'Poppins',sans-serif;letter-spacing:-.02em;color:#fff;margin:0 0 16px;max-width:22ch;text-wrap:pretty\">Klar til at komme i gang med EasyLeave?<\u002Fh1>\n    <p style=\"font:400 16px/1.6 'Poppins',sans-serif;color:rgba(255,255,255,.86);max-width:56ch;margin:0 0 26px;text-wrap:pretty\">Vi skal have nogle oplysninger for at sætte EasyLeave op til jer: kontaktpersoner, administratorer og de orlovsregler, der gælder for jeres medarbejdergrupper.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:9px;padding:10px 15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#fff\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5.6\"><\u002Fcircle><path d=\"M8 5.2V8l2 1.4\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font:500 13px/1.3 'Poppins',sans-serif;color:#fff\">15–30 minutter<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;padding:10px 15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#fff\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5.4h10M3 8h10M3 10.6h6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font:500 13px/1.3 'Poppins',sans-serif;color:#fff\">6 trin — du kan gå frem og tilbage<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden;margin:0 0 26px\">\n    <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:15px 24px\">\n      <h2 style=\"font:700 20px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">Inden du starter<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n      <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#3a3835;margin:0;max-width:64ch\">Hav jeres orlovsregler i nærheden — overenskomster, personalehåndbog og interne retningslinjer. Mangler der noget, skriver du bare det, du ved.<\u002Fp>\n      <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#3a3835;margin:0;max-width:64ch\">Workbooken sender ikke sig selv: du udfylder, downloader den som PDF og sender den til os. Gem en kladde undervejs, hvis du vil fortsætte senere.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n    <button type=\"button\" sc-camel-on-click=\"{{ start }}\" style=\"display:inline-flex;align-items:center;gap:10px;font:600 15px/1 'Poppins',sans-serif;background:#576048;color:#fff;border:none;border-radius:10px;padding:16px 28px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:#47503a\">\n      Start workbooken\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.5 8h9M9 4.5L12.5 8 9 11.5\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ pickDraft }}\" style=\"display:inline-flex;align-items:center;gap:9px;font:600 14px/1 'Poppins',sans-serif;background:#fff;color:#576048;border:1px solid #576048;border-radius:10px;padding:15px 22px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08)\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 10.5V3M5.2 7.7L8 10.5l2.8-2.8M3 12.8h10\"><\u002Fpath><\u002Fsvg>\n      Genoptag kladde\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ draftMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"font:500 13px/1.5 'Poppins',sans-serif;color:#576048;margin:14px 0 0\">{{ draftMsg }}<\u002Fp>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"01 Indledende oplysninger\" style=\"animation:elwbIn .24s ease-out\">\n  <h1 style=\"font:700 32px/1.15 'Poppins',sans-serif;letter-spacing:-.02em;color:#1e1e1e;margin:0 0 8px\">Indledende oplysninger<\u002Fh1>\n  <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#888580;margin:0 0 24px\">Alle fire felter skal udfyldes.<\u002Fp>\n\n  <sc-if value=\"{{ hasErrors }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:14px;padding:18px 20px;margin:0 0 22px\">\n      <p style=\"display:flex;gap:9px;align-items:center;font:700 17px/1.3 'Poppins',sans-serif;color:#b3261e;margin:0 0 10px\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" style=\"flex:0 0 auto\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M8 4.8v3.4M8 11.1h.01\"><\u002Fpath><\u002Fsvg>\n        <span>{{ errorTitle }}<\u002Fspan>\n      <\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ errorList }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <button type=\"button\" sc-camel-on-click=\"{{ e.onClick }}\" style=\"display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:#fff;border:1px solid #f2c4bf;border-radius:9px;padding:10px 12px;cursor:pointer;transition:border-color .15s ease-out\" style-hover=\"border-color:#d9382a\">\n            <span style=\"font:600 13px/1.45 'Poppins',sans-serif;color:#b3261e;flex:0 0 auto\">{{ e.label }}<\u002Fspan>\n            <span style=\"font:400 13px/1.45 'Poppins',sans-serif;color:#3a3835\">{{ e.msg }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden\">\n    <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:15px 24px\">\n      <h2 style=\"font:700 19px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">Kontakt og virksomhed<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n\n    <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n      <label for=\"elwb-contact\" style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">1. Primær kontaktperson for opsætningen<\u002Flabel>\n      <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Hvem skriver vi til, når vi har spørgsmål?<\u002Fp>\n      <input id=\"elwb-contact\" type=\"text\" data-autofocus=\"1\" value=\"{{ contactName.value }}\" sc-camel-on-change=\"{{ contactName.onChange }}\" placeholder=\"Fornavn og efternavn\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none;transition:border-color .15s ease-out,box-shadow .15s ease-out\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n      <sc-if value=\"{{ contactName.error }}\" hint-placeholder-val=\"{{ false }}\">\n        <p data-errmsg=\"1\" data-errkey=\"{{ contactName.key }}\" style=\"display:flex;gap:8px;align-items:flex-start;background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" style=\"flex:0 0 auto;margin-top:2px\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5.6\"><\u002Fcircle><path d=\"M8 5.2v3.2M8 10.9h.01\"><\u002Fpath><\u002Fsvg>\n          <span>{{ contactName.error }}<\u002Fspan>\n        <\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n      <label for=\"elwb-company\" style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">2. Virksomhedsnavn i EasyLeave<\u002Flabel>\n      <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Navnet vises ved login og i teksterne til medarbejderne. Har I flere navne, skriv det primære.<\u002Fp>\n      <input id=\"elwb-company\" type=\"text\" value=\"{{ companyName.value }}\" sc-camel-on-change=\"{{ companyName.onChange }}\" placeholder=\"F.eks. Nordjysk Transport A/S\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none;transition:border-color .15s ease-out,box-shadow .15s ease-out\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n      <sc-if value=\"{{ companyName.error }}\" hint-placeholder-val=\"{{ false }}\">\n        <p data-errmsg=\"1\" data-errkey=\"{{ companyName.key }}\" style=\"display:flex;gap:8px;align-items:flex-start;background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" style=\"flex:0 0 auto;margin-top:2px\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5.6\"><\u002Fcircle><path d=\"M8 5.2v3.2M8 10.9h.01\"><\u002Fpath><\u002Fsvg>\n          <span>{{ companyName.error }}<\u002Fspan>\n        <\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div data-field=\"\" role=\"radiogroup\" aria-label=\"Ansvarlig afdeling for orlovssager\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n      <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">3. Ansvarlig afdeling for orlovssager<\u002Fp>\n      <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Vælg det, der ligger tættest på jeres organisation.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n        <sc-for list=\"{{ deptOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n          <label style=\"display:inline-flex;align-items:center;gap:9px;padding:11px 14px;border:1px solid #dcd9d2;border-radius:10px;background:#fff;font:500 13.5px/1 'Poppins',sans-serif;color:#3a3835;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.05)\">\n            <input type=\"radio\" name=\"elwb-dept\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.onChange }}\" style=\"margin:0\">\n            <span>{{ o.label }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ deptIsOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <input type=\"text\" value=\"{{ deptOther.value }}\" sc-camel-on-change=\"{{ deptOther.onChange }}\" placeholder=\"Hvad kalder I afdelingen?\" aria-label=\"Anden afdeling\" style=\"width:100%;box-sizing:border-box;margin:12px 0 0;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n      <\u002Fsc-if>\n      <sc-if value=\"{{ deptError }}\" hint-placeholder-val=\"{{ false }}\">\n        <p data-errmsg=\"1\" data-errkey=\"dept\" style=\"display:flex;gap:8px;align-items:flex-start;background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" style=\"flex:0 0 auto;margin-top:2px\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5.6\"><\u002Fcircle><path d=\"M8 5.2v3.2M8 10.9h.01\"><\u002Fpath><\u002Fsvg>\n          <span>{{ deptError }}<\u002Fspan>\n        <\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n      <label for=\"elwb-deptmail\" style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">4. E-mail til den ansvarlige afdeling<\u002Flabel>\n      <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Gerne en fællespostkasse.<\u002Fp>\n      <input id=\"elwb-deptmail\" type=\"email\" value=\"{{ deptEmail.value }}\" sc-camel-on-change=\"{{ deptEmail.onChange }}\" placeholder=\"loen@virksomhed.dk\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none;transition:border-color .15s ease-out,box-shadow .15s ease-out\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n      <sc-if value=\"{{ deptEmail.error }}\" hint-placeholder-val=\"{{ false }}\">\n        <p data-errmsg=\"1\" data-errkey=\"{{ deptEmail.key }}\" style=\"display:flex;gap:8px;align-items:flex-start;background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=
