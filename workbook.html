ff;border:1px solid #f2c4bf;border-radius:9px;padding:10px 12px;cursor:pointer;transition:border-color .15s ease-out\" style-hover=\"border-color:#d9382a\">\n            <span style=\"font:600 13px/1.45 'Poppins',sans-serif;color:#b3261e;flex:0 0 auto\">{{ e.label }}<\u002Fspan>\n            <span style=\"font:400 13px/1.45 'Poppins',sans-serif;color:#3a3835\">{{ e.msg }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ admins }}\" as=\"a\" hint-placeholder-count=\"1\">\n      <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:13px 18px\">\n          <span style=\"display:flex;align-items:center;gap:11px\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:#576048;color:#fff;font:700 12px/1 'Poppins',sans-serif\">{{ a.num }}<\u002Fspan>\n            <span style=\"font:700 16px/1.3 'Poppins',sans-serif;color:#3a3835\">Administrator {{ a.num }}<\u002Fspan>\n          <\u002Fspan>\n          <sc-if value=\"{{ a.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ a.remove }}\" aria-label=\"Fjern administrator\" title=\"Fjern administrator\" style=\"display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #dcd9d2;border-radius:8px;padding:7px 11px;color:#725251;font:500 12.5px/1 'Poppins',sans-serif;cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out\" style-hover=\"background:rgba(153,113,111,.10);border-color:#99716f\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.2 5h9.6M6.4 5V3.6h3.2V5M4.6 5l.6 8.4h5.6L11.4 5\"><\u002Fpath><\u002Fsvg>\n              Fjern\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:15px 16px\">\n            <label style=\"display:block;font:600 14px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 8px\">Navn<\u002Flabel>\n            <input type=\"text\" data-autofocus=\"{{ a.autofocus }}\" value=\"{{ a.name.value }}\" sc-camel-on-change=\"{{ a.name.onChange }}\" placeholder=\"Fornavn og efternavn\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n            <sc-if value=\"{{ a.name.error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ a.name.key }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 12.5px/1.45 'Poppins',sans-serif;color:#b3261e;margin:9px 0 0\">{{ a.name.error }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:15px 16px\">\n            <label style=\"display:block;font:600 14px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 8px\">E-mail<\u002Flabel>\n            <input type=\"email\" value=\"{{ a.email.value }}\" sc-camel-on-change=\"{{ a.email.onChange }}\" placeholder=\"navn@virksomhed.dk\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n            <sc-if value=\"{{ a.email.error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ a.email.key }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 12.5px/1.45 'Poppins',sans-serif;color:#b3261e;margin:9px 0 0\">{{ a.email.error }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <button type=\"button\" sc-camel-on-click=\"{{ addAdmin }}\" style=\"display:inline-flex;align-items:center;gap:9px;margin:16px 0 0;font:600 14px/1 'Poppins',sans-serif;background:#fff;color:#576048;border:1px solid #576048;border-radius:10px;padding:13px 19px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08)\">\n    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 3.4v9.2M3.4 8h9.2\"><\u002Fpath><\u002Fsvg>\n    Tilføj administrator\n  <\u002Fbutton>\n\n  <p style=\"font:400 13.5px/1.6 'Poppins',sans-serif;color:#888580;margin:18px 0 0;max-width:62ch\">Du kan altid invitere flere brugere senere i EasyLeave.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"03 Ansættelsestyper\" style=\"animation:elwbIn .24s ease-out\">\n  <h1 style=\"font:700 32px/1.15 'Poppins',sans-serif;letter-spacing:-.02em;color:#1e1e1e;margin:0 0 14px\">Ansættelsestyper<\u002Fh1>\n\n  <div style=\"background:rgba(87,96,72,.10);border:1px solid rgba(87,96,72,.18);border-radius:16px;padding:22px 24px;margin:0 0 22px\">\n    <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#3a3835;margin:0 0 14px;max-width:62ch\">En ansættelsestype samler medarbejdere med samme orlovsregler. Følger to grupper ikke samme regler og helligdage, skal de have hver sin type.<\u002Fp>\n    <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px\">\n      <li style=\"display:flex;gap:10px;font:400 13.5px/1.5 'Poppins',sans-serif;color:#3a3835\"><span style=\"flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#576048;margin-top:7px\"><\u002Fspan><span><strong style=\"font-weight:600\">Chauffører<\u002Fstrong> — Transportoverenskomsten og dens helligdagskalender<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:10px;font:400 13.5px/1.5 'Poppins',sans-serif;color:#3a3835\"><span style=\"flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#576048;margin-top:7px\"><\u002Fspan><span><strong style=\"font-weight:600\">Kontor<\u002Fstrong> — HK-overenskomsten<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:10px;font:400 13.5px/1.5 'Poppins',sans-serif;color:#3a3835\"><span style=\"flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#576048;margin-top:7px\"><\u002Fspan><span><strong style=\"font-weight:600\">Ledelse<\u002Fstrong> — interne personalepolitikker. Har ledelsen andre helligdage, bliver det sin egen type<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasErrors }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:14px;padding:18px 20px;margin:0 0 22px\">\n      <p style=\"display:flex;gap:9px;align-items:center;font:700 17px/1.3 'Poppins',sans-serif;color:#b3261e;margin:0 0 6px\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" style=\"flex:0 0 auto\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M8 4.8v3.4M8 11.1h.01\"><\u002Fpath><\u002Fsvg>\n        <span>{{ errorTitle }}<\u002Fspan>\n      <\u002Fp>\n      <p style=\"font:400 13px/1.5 'Poppins',sans-serif;color:#725251;margin:0 0 12px\">Klik på et punkt for at hoppe direkte til det.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ errorList }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <button type=\"button\" sc-camel-on-click=\"{{ e.onClick }}\" style=\"display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:#fff;border:1px solid #f2c4bf;border-radius:9px;padding:10px 12px;cursor:pointer;transition:border-color .15s ease-out\" style-hover=\"border-color:#d9382a\">\n            <span style=\"font:600 13px/1.45 'Poppins',sans-serif;color:#b3261e;flex:0 0 auto\">{{ e.label }}<\u002Fspan>\n            <span style=\"font:400 13px/1.45 'Poppins',sans-serif;color:#3a3835\">{{ e.msg }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showOverview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden;margin:0 0 20px\">\n      <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:13px 18px\">\n        <p style=\"font:700 15px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">Oversigt · {{ typeCount }} ansættelsestyper<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;max-height:280px;overflow-y:auto;padding:6px 14px 10px\">\n        <sc-for list=\"{{ overview }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button type=\"button\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid #f0efeb;padding:11px 4px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.05)\">\n            <span style=\"flex:0 0 auto;width:22px;font:600 12.5px/1 'Poppins',sans-serif;color:#888580\">{{ o.num }}<\u002Fspan>\n            <span style=\"flex:1 1 auto;min-width:0;font:500 14px/1.35 'Poppins',sans-serif;color:#3a3835;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ o.title }}<\u002Fspan>\n            <span style=\"{{ o.statusStyle }}\">{{ o.status }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"1\">\n      <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden\">\n\n        <div style=\"{{ t.headStyle }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.toggle }}\" aria-expanded=\"{{ t.open }}\" style=\"flex:1 1 auto;display:flex;align-items:center;gap:13px;background:transparent;border:none;padding:0;cursor:pointer;text-align:left\">\n            <span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:#576048;font:700 13px/1 'Poppins',sans-serif;color:#fff\">{{ t.num }}<\u002Fspan>\n            <span style=\"flex:1 1 auto;min-width:0\">\n              <span style=\"display:block;font:700 19px/1.3 'Poppins',sans-serif;color:#3a3835;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.title }}<\u002Fspan>\n              <span style=\"{{ t.statusStyle }}\">{{ t.status }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"{{ t.chevronStyle }}\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#576048\" sc-camel-stroke-width=\"1.7\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6.2L8 10.2l4-4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ t.showTrash }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t.askRemove }}\" aria-label=\"Fjern ansættelsestype\" title=\"Fjern ansættelsestype\" style=\"flex:0 0 auto;display:inline-flex;align-items:center;background:#fff;border:1px solid #dcd9d2;border-radius:8px;padding:8px;color:#725251;cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out\" style-hover=\"background:rgba(153,113,111,.10);border-color:#99716f\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.2 5h9.6M6.4 5V3.6h3.2V5M4.6 5l.6 8.4h5.6L11.4 5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ t.confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(153,113,111,.12);border-top:1px solid #e2e0db;padding:14px 18px\">\n            <span style=\"flex:1 1 200px;font:500 13.5px/1.45 'Poppins',sans-serif;color:#725251\">Slet “{{ t.title }}”? Kortet indeholder udfyldte svar, som ikke kan hentes tilbage.<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ t.remove }}\" style=\"font:600 13px/1 'Poppins',sans-serif;background:#725251;color:#fff;border:none;border-radius:8px;padding:11px 15px;cursor:pointer\">Slet ansættelsestype<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ t.cancelRemove }}\" style=\"font:600 13px/1 'Poppins',sans-serif;background:#fff;color:#3a3835;border:1px solid #dcd9d2;border-radius:8px;padding:11px 15px;cursor:pointer\">Behold<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ t.open }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:18px;border-top:1px solid #e2e0db;display:flex;flex-direction:column;gap:14px\">\n\n          <sc-if value=\"{{ t.showCopy }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <sc-if value=\"{{ t.copyClosed }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(87,96,72,.10);border-radius:12px;padding:13px 15px\">\n                  <span style=\"flex:1 1 200px;font:500 13.5px/1.4 'Poppins',sans-serif;color:#3a3835\">Afviger denne type kun på et par punkter?<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ t.openCopy }}\" style=\"font:600 13px/1 'Poppins',sans-serif;color:#576048;background:#fff;border:1px solid #576048;border-radius:8px;padding:10px 13px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08)\">Kopiér fra ansættelsestype…<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ t.copyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#fff;border:1px solid #576048;border-radius:12px;padding:14px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px\">\n                    <span style=\"font:600 14px/1.35 'Poppins',sans-serif;color:#3a3835\">Kopiér alle svar fra<\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.closeCopy }}\" style=\"font:500 12.5px/1 'Poppins',sans-serif;color:#888580;background:transparent;border:none;padding:4px;cursor:pointer\">Luk<\u002Fbutton>\n                  <\u002Fdiv>\n                  <input type=\"text\" value=\"{{ t.copyQuery.value }}\" sc-camel-on-change=\"{{ t.copyQuery.onChange }}\" placeholder=\"Søg efter navn\" aria-label=\"Søg efter ansættelsestype\" style=\"width:100%;box-sizing:border-box;margin:0 0 10px;font:400 13.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:9px;padding:10px 11px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n                  <div style=\"max-height:190px;overflow-y:auto;border-top:1px solid #eae8e2\">\n                    <sc-for list=\"{{ t.copySources }}\" as=\"c\" hint-placeholder-count=\"2\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid #eae8e2;padding:10px 4px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.06)\">\n                        <span style=\"flex:0 0 auto;width:20px;font:600 12px/1 'Poppins',sans-serif;color:#888580\">{{ c.num }}<\u002Fspan>\n                        <span style=\"flex:1 1 auto;min-width:0;font:500 13.5px/1.35 'Poppins',sans-serif;color:#3a3835;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.label }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ t.copyEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <p style=\"font:400 13px/1.5 'Poppins',sans-serif;color:#888580;margin:12px 4px\">Ingen typer matcher søgningen.<\u002Fp>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <p style=\"font:400 12px/1.5 'Poppins',sans-serif;color:#888580;margin:10px 0 0\">Navnet på denne type bevares — alt andet overskrives.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <label style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 12px\">a. Navn på ansættelsestype<\u002Flabel>\n            <input type=\"text\" data-autofocus=\"{{ t.autofocus }}\" value=\"{{ t.name.value }}\" sc-camel-on-change=\"{{ t.name.onChange }}\" placeholder=\"F.eks. Chauffører, Kontor (HK), Lager, Ledelse\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n            <sc-if value=\"{{ t.name.error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.name.key }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ t.name.error }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div data-field=\"\" role=\"radiogroup\" aria-label=\"Unikt ID for denne ansættelsestype\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">b. Unikt ID<\u002Fp>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Det, der entydigt identificerer en medarbejder i denne type.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n              <sc-for list=\"{{ t.uidOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <label style=\"display:inline-flex;align-items:center;gap:9px;padding:11px 14px;border:1px solid #dcd9d2;border-radius:10px;background:#fff;font:500 13.5px/1 'Poppins',sans-serif;color:#3a3835;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.05)\">\n                  <input type=\"radio\" name=\"{{ o.name }}\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.onChange }}\" style=\"margin:0\">\n                  <span>{{ o.label }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ t.uidIsOther }}\" hint-placeholder-val=\"{{ false }}\">\n              <input type=\"text\" value=\"{{ t.uidOther.value }}\" sc-camel-on-change=\"{{ t.uidOther.onChange }}\" placeholder=\"Hvad bruger I som unikt ID?\" aria-label=\"Andet unikt ID\" style=\"width:100%;box-sizing:border-box;margin:12px 0 0;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.uidError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.uidKey }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ t.uidError }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div data-field=\"\" role=\"group\" aria-label=\"Helligdage for denne ansættelsestype\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 4px\">\n              <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0\">c. Helligdage<\u002Fp>\n              <div style=\"display:flex;gap:8px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.selectAll }}\" style=\"font:500 12.5px/1 'Poppins',sans-serif;color:#576048;background:#fff;border:1px solid #dcd9d2;border-radius:8px;padding:8px 11px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08)\">Vælg alle<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ t.clearAll }}\" style=\"font:500 12.5px/1 'Poppins',sans-serif;color:#888580;background:#fff;border:1px solid #dcd9d2;border-radius:8px;padding:8px 11px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:#eae8e4\">Ryd<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 14px;max-width:60ch\">Bruges til at beregne bl.a. sidste arbejdsdag før orlovsstart.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px\">\n              <sc-for list=\"{{ t.holidays }}\" as=\"h\" hint-placeholder-count=\"16\">\n                <label style=\"display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #dcd9d2;border-radius:10px;background:#fff;font:400 13.5px/1.3 'Poppins',sans-serif;color:#3a3835;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.05)\">\n                  <input type=\"checkbox\" checked=\"{{ h.checked }}\" sc-camel-on-change=\"{{ h.onChange }}\" style=\"margin:0;flex:0 0 auto\">\n                  <span>{{ h.label }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ t.holidayOtherShown }}\" hint-placeholder-val=\"{{ false }}\">\n              <input type=\"text\" value=\"{{ t.holidayOther.value }}\" sc-camel-on-change=\"{{ t.holidayOther.onChange }}\" placeholder=\"Hvilke andre fri- eller helligdage?\" aria-label=\"Andre helligdage\" style=\"width:100%;box-sizing:border-box;margin:10px 0 0;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n            <\u002Fsc-if>\n            <label style=\"display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:11px 12px;border:1px dashed #c7c3ba;border-radius:10px;background:#fff;font:400 13.5px/1.3 'Poppins',sans-serif;color:#3a3835;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ t.noHolidays.checked }}\" sc-camel-on-change=\"{{ t.noHolidays.onChange }}\" style=\"margin:0\">\n              <span>Denne ansættelsestype har ingen helligdage<\u002Fspan>\n            <\u002Flabel>\n            <sc-if value=\"{{ t.holidaysError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.holidaysKey }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ t.holidaysError }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">d. E-mailmodtagere ved registrering af orlov<\u002Fp>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 16px;max-width:60ch\">Når en medarbejder registrerer sit orlovsforløb, sendes en kopi til de adresser, medarbejderen udfylder. Vælg for hvert felt, om det er obligatorisk, valgfrit eller slet ikke skal vises.<\u002Fp>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start\">\n              <div role=\"group\" aria-label=\"E-mailmodtagere\" style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ t.mailRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div role=\"radiogroup\" aria-label=\"{{ r.label }}\" style=\"background:#fff;border:1px solid #dcd9d2;border-radius:12px;padding:13px 14px\">\n                    <p style=\"font:600 13.5px/1.35 'Poppins',sans-serif;color:#3a3835;margin:0 0 10px\">{{ r.label }}<\u002Fp>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                        <label style=\"flex:1 1 96px;display:inline-flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid #dcd9d2;border-radius:9px;background:#faf9f7;font:500 12.5px/1.2 'Poppins',sans-serif;color:#3a3835;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.06)\">\n                          <input type=\"radio\" name=\"{{ c.name }}\" checked=\"{{ c.checked }}\" sc-camel-on-change=\"{{ c.onChange }}\" style=\"margin:0;flex:0 0 auto\">\n                          <span>{{ c.label }}<\u002Fspan>\n                        <\u002Flabel>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #dcd9d2;border-radius:12px;padding:16px\" aria-hidden=\"true\">\n                <p style=\"font:700 11px/1 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#b0ada8;margin:0 0 12px\">Sådan ser det ud for medarbejderen<\u002Fp>\n                <div style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:10px;padding:14px\">\n                  <div style=\"height:5px;width:52px;border-radius:999px;background:#576048;margin:0 0 12px\"><\u002Fdiv>\n                  <p style=\"font:600 12.5px/1.35 'Poppins',sans-serif;color:#3a3835;margin:0 0 12px\">Kopi af forløbet sendes til<\u002Fp>\n                  <p style=\"font:600 10.5px/1.3 'Poppins',sans-serif;color:#888580;margin:0 0 5px\">Arbejdsmail<\u002Fp>\n                  <div style=\"height:30px;border:1px solid #e2e0db;border-radius:7px;background:#fff;margin:0 0 12px\"><\u002Fdiv>\n                  <p style=\"font:600 10.5px/1.3 'Poppins',sans-serif;color:#888580;margin:0 0 5px\">Leders mail<\u002Fp>\n                  <div style=\"height:30px;border:1px solid #e2e0db;border-radius:7px;background:#fff;margin:0 0 12px\"><\u002Fdiv>\n                  <p style=\"font:600 10.5px/1.3 'Poppins',sans-serif;color:#888580;margin:0 0 5px\">Privat mail<\u002Fp>\n                  <div style=\"height:30px;border:1px solid #e2e0db;border-radius:7px;background:#fff;margin:0 0 14px\"><\u002Fdiv>\n                  <div style=\"height:32px;border-radius:8px;background:#576048\"><\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"font:500 12px/1.4 'Poppins',sans-serif;color:#888580;margin:12px 0 0\">Felter, du sætter til “Ej synlig”, vises slet ikke.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:11px;align-items:flex-start;margin:16px 0 0;background:rgba(153,113,111,.12);border-radius:12px;padding:14px 15px\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#725251\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:1px\" aria-hidden=\"true\"><path d=\"M8 1.8a4 4 0 00-2.4 7.2v1.4h4.8V9A4 4 0 008 1.8z\"><\u002Fpath><path d=\"M6.5 13.2h3\"><\u002Fpath><\u002Fsvg>\n              <p style=\"font:400 13.5px/1.55 'Poppins',sans-serif;color:#3a3835;margin:0\">Gør den private e-mail obligatorisk, hvis medarbejderne ikke har adgang til arbejdsmailen under orlov.<\u002Fp>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ t.mailError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.mailKey }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:12px 0 0\">{{ t.mailError }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">e. Faste modtagere <span style=\"font-weight:400;color:#b0ada8\">(valgfrit)<\u002Fspan><\u002Fp>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 14px;max-width:60ch\">En fast modtager får altid en kopi, når nogen på denne type registrerer orlov. Flere kan tilføjes senere i EasyLeave.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ t.fixed }}\" as=\"f\" hint-placeholder-count=\"2\">\n                <div data-field=\"\" style=\"background:#fff;border:1px solid #dcd9d2;border-radius:12px;padding:14px\">\n                  <label style=\"display:block;font:600 13.5px/1.35 'Poppins',sans-serif;color:#3a3835;margin:0 0 8px\">E-mail på fast modtager {{ f.num }}<\u002Flabel>\n                  <input type=\"email\" value=\"{{ f.email.value }}\" sc-camel-on-change=\"{{ f.email.onChange }}\" placeholder=\"navn@virksomhed.dk\" style=\"width:100%;box-sizing:border-box;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#faf9f7;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;background:#fff;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n                  <sc-if value=\"{{ f.email.error }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p data-errmsg=\"1\" data-errkey=\"{{ f.email.key }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ f.email.error }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ f.hasEmail }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div role=\"radiogroup\" aria-label=\"Modtagertype for fast modtager\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0\">\n                      <sc-for list=\"{{ f.modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                        <label style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #dcd9d2;border-radius:9px;background:#faf9f7;font:500 12.5px/1 'Poppins',sans-serif;color:#3a3835;cursor:pointer\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.06)\">\n                          <input type=\"radio\" name=\"{{ m.name }}\" checked=\"{{ m.checked }}\" sc-camel-on-change=\"{{ m.onChange }}\" style=\"margin:0\">\n                          <span>{{ m.label }}<\u002Fspan>\n                        <\u002Flabel>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">f. Løn under barnets indlæggelse<\u002Fp>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 14px;max-width:60ch\">Udbetaler I løn, hvis orloven forlænges, fordi barnet er indlagt?<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ t.hospital }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div role=\"radiogroup\" aria-label=\"{{ r.aria }}\" style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #dcd9d2;border-radius:12px;padding:13px 14px\">\n                  <span style=\"flex:1 1 140px;font:600 13.5px/1.35 'Poppins',sans-serif;color:#3a3835\">{{ r.label }}<\u002Fspan>\n                  <div style=\"display:flex;gap:8px;flex:0 0 auto\">\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"2\">\n                      <label style=\"display:inline-flex;align-items:center;gap:8px;min-width:78px;padding:9px 12px;border:1px solid #dcd9d2;border-radius:9px;background:#faf9f7;font:500 12.5px/1 'Poppins',sans-serif;color:#3a3835;cursor:pointer\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.06)\">\n                        <input type=\"radio\" name=\"{{ c.name }}\" checked=\"{{ c.checked }}\" sc-camel-on-change=\"{{ c.onChange }}\" style=\"margin:0\">\n                        <span>{{ c.label }}<\u002Fspan>\n                      <\u002Flabel>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ t.hospitalError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.hospitalKey }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ t.hospitalError }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div data-field=\"\" style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n            <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">g. Delvis (drypvis) orlov<\u002Fp>\n            <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 14px;max-width:60ch\">Må orloven afholdes delvist — fx enkelte ugedage ad gangen?<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ t.partial }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div role=\"radiogroup\" aria-label=\"{{ r.aria }}\" style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #dcd9d2;border-radius:12px;padding:13px 14px\">\n                  <span style=\"flex:1 1 140px;font:600 13.5px/1.35 'Poppins',sans-serif;color:#3a3835\">{{ r.label }}<\u002Fspan>\n                  <div style=\"display:flex;gap:8px;flex:0 0 auto\">\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"2\">\n                      <label style=\"display:inline-flex;align-items:center;gap:8px;min-width:78px;padding:9px 12px;border:1px solid #dcd9d2;border-radius:9px;background:#faf9f7;font:500 12.5px/1 'Poppins',sans-serif;color:#3a3835;cursor:pointer\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.06)\">\n                        <input type=\"radio\" name=\"{{ c.name }}\" checked=\"{{ c.checked }}\" sc-camel-on-change=\"{{ c.onChange }}\" style=\"margin:0\">\n                        <span>{{ c.label }}<\u002Fspan>\n                      <\u002Flabel>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ t.partialError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p data-errmsg=\"1\" data-errkey=\"{{ t.partialKey }}\" style=\"background:#fdecea;border:1px solid #f2c4bf;border-radius:9px;padding:9px 11px;font:500 13px/1.45 'Poppins',sans-serif;color:#b3261e;margin:10px 0 0\">{{ t.partialError }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <button type=\"button\" sc-camel-on-click=\"{{ addType }}\" style=\"display:inline-flex;align-items:center;gap:9px;margin:16px 0 0;font:600 14px/1 'Poppins',sans-serif;background:#fff;color:#576048;border:1px solid #576048;border-radius:10px;padding:13px 20px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08)\">\n    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 3.4v9.2M3.4 8h9.2\"><\u002Fpath><\u002Fsvg>\n    Tilføj ansættelsestype\n  <\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"04 Materiale\" style=\"animation:elwbIn .24s ease-out\">\n  <h1 style=\"font:700 32px/1.15 'Poppins',sans-serif;letter-spacing:-.02em;color:#1e1e1e;margin:0 0 10px\">Materiale<\u002Fh1>\n  <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#3a3835;max-width:62ch;margin:0 0 24px;text-wrap:pretty\">Til opsætningen bruger vi det materiale, der beskriver jeres orlovsregler — én overenskomst pr. ansættelsestype, hvis de er forskellige. Er materialet ikke komplet, er det helt fint.<\u002Fp>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden\">\n    <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:15px 24px\">\n      <h2 style=\"font:700 19px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">1. Hvilket materiale kan I sende os?<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px\">\n      <div role=\"group\" aria-label=\"Hvilket materiale kan I sende\" style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ materials }}\" as=\"m\" hint-placeholder-count=\"6\">\n          <label style=\"display:flex;align-items:center;gap:11px;padding:13px 15px;background:#faf9f7;border:1px solid #eae8e2;border-radius:11px;font:400 14.5px/1.4 'Poppins',sans-serif;color:#3a3835;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out\" style-hover=\"border-color:#576048;background:rgba(87,96,72,.06)\">\n            <input type=\"checkbox\" checked=\"{{ m.checked }}\" sc-camel-on-change=\"{{ m.onChange }}\" style=\"margin:0;flex:0 0 auto\">\n            <span>{{ m.label }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ materialOtherShown }}\" hint-placeholder-val=\"{{ false }}\">\n        <input type=\"text\" value=\"{{ materialOther.value }}\" sc-camel-on-change=\"{{ materialOther.onChange }}\" placeholder=\"Hvilket andet materiale?\" aria-label=\"Andet materiale\" style=\"width:100%;box-sizing:border-box;margin:10px 0 0;font:400 14.5px/1.5 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\">\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:11px;align-items:flex-start;margin:18px 0 0;background:rgba(87,96,72,.10);border-radius:12px;padding:14px 15px\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#576048\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:1px\" aria-hidden=\"true\"><rect x=\"2.4\" y=\"3.8\" width=\"11.2\" height=\"8.4\" rx=\"1.6\"><\u002Frect><path d=\"M3 4.6l5 4 5-4\"><\u002Fpath><\u002Fsvg>\n        <p style=\"font:400 13.5px/1.55 'Poppins',sans-serif;color:#3a3835;margin:0\">Filerne kan ikke uploades her. Du sender dem med i e-mailen sammen med PDF’en — vi samler listen for dig på sidste trin.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStep5 }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"05 Bemærkninger\" style=\"animation:elwbIn .24s ease-out\">\n  <h1 style=\"font:700 32px/1.15 'Poppins',sans-serif;letter-spacing:-.02em;color:#1e1e1e;margin:0 0 10px\">Bemærkninger og feedback<\u002Fh1>\n  <p style=\"font:400 14.5px/1.6 'Poppins',sans-serif;color:#888580;margin:0 0 24px\">Alt på dette trin er valgfrit — men det hjælper os meget.<\u002Fp>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden\">\n    <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:15px 24px\">\n      <h2 style=\"font:700 19px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">Noget vi skal vide?<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n        <label for=\"elwb-notes\" style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 4px\">1. Supplerende oplysninger <span style=\"font-weight:400;color:#b0ada8\">(valgfrit)<\u002Fspan><\u002Flabel>\n        <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 12px\">Særaftaler, undtagelser eller kommende ændringer.<\u002Fp>\n        <textarea id=\"elwb-notes\" rows=\"5\" data-autofocus=\"1\" value=\"{{ notes.value }}\" sc-camel-on-change=\"{{ notes.onChange }}\" placeholder=\"Skriv frit her\" style=\"width:100%;box-sizing:border-box;resize:vertical;font:400 14.5px/1.6 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n        <p style=\"font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 12px\">2. Hvor nem var workbooken at besvare? <span style=\"font-weight:400;color:#b0ada8\">(valgfrit)<\u002Fspan><\u002Fp>\n        <div role=\"radiogroup\" aria-label=\"Bedømmelse fra 1 til 5\" style=\"display:flex;align-items:center;gap:6px\">\n          <sc-for list=\"{{ stars }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" aria-label=\"{{ s.aria }}\" aria-pressed=\"{{ s.active }}\" style=\"background:transparent;border:none;padding:4px;cursor:pointer;line-height:0\">\n              <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 20 20\" fill=\"{{ s.fill }}\" stroke=\"#576048\" sc-camel-stroke-width=\"1.1\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 1.9l2.5 5.1 5.6.8-4.1 4 1 5.6L10 14.7l-5 2.7 1-5.6L1.9 7.8l5.6-.8z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"font:500 13px/1.4 'Poppins',sans-serif;color:#888580;margin-left:8px\">{{ ratingLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#faf9f7;border:1px solid #eae8e2;border-radius:12px;padding:17px 18px\">\n        <label for=\"elwb-feedback\" style=\"display:block;font:600 15.5px/1.4 'Poppins',sans-serif;color:#1e1e1e;margin:0 0 12px\">3. Hvad kan vi gøre bedre? <span style=\"font-weight:400;color:#b0ada8\">(valgfrit)<\u002Fspan><\u002Flabel>\n        <textarea id=\"elwb-feedback\" rows=\"4\" value=\"{{ feedback.value }}\" sc-camel-on-change=\"{{ feedback.onChange }}\" placeholder=\"Var noget uklart eller besværligt?\" style=\"width:100%;box-sizing:border-box;resize:vertical;font:400 14.5px/1.6 'Poppins',sans-serif;color:#1e1e1e;background:#fff;border:1px solid #dcd9d2;border-radius:10px;padding:12px 13px;outline:none\" style-focus=\"border-color:#576048;box-shadow:0 0 0 3px rgba(87,96,72,.12)\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStep6 }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"06 Aflevering\" style=\"animation:elwbIn .24s ease-out\">\n  <div style=\"background:linear-gradient(160deg,#6d7a5a 0%,#576048 52%,#47503a 100%);border-radius:18px;padding:34px 34px;margin:0 0 20px\">\n    <p style=\"font:700 11.5px/1 'Poppins',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 14px\">Sidste trin<\u002Fp>\n    <h1 style=\"font:700 34px/1.15 'Poppins',sans-serif;letter-spacing:-.02em;color:#fff;margin:0 0 12px;max-width:24ch;text-wrap:pretty\">Send din besvarelse til os<\u002Fh1>\n    <p style=\"font:400 15.5px/1.6 'Poppins',sans-serif;color:rgba(255,255,255,.86);max-width:56ch;margin:0;text-wrap:pretty\">Download besvarelsen som PDF og send den til os sammen med materialet på listen herunder.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;padding:26px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);margin:0 0 18px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ printPdf }}\" style=\"display:inline-flex;align-items:center;gap:11px;font:600 15px/1 'Poppins',sans-serif;background:#576048;color:#fff;border:none;border-radius:10px;padding:17px 28px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:#47503a\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 10.6V2.8M5 7.6L8 10.6l3-3M2.8 13.2h10.4\"><\u002Fpath><\u002Fsvg>\n      Download din besvarelse som PDF\n    <\u002Fbutton>\n    <p style=\"font:400 13.5px/1.6 'Poppins',sans-serif;color:#888580;margin:14px 0 0;max-width:58ch\">Printdialogen åbner. Vælg “Gem som PDF”, og slå sidehoved og sidefod fra.<\u002Fp>\n    <p class=\"elwb-mobile-only\" style=\"font:400 13.5px/1.6 'Poppins',sans-serif;color:#888580;margin:8px 0 0\">På mobil: vælg “Gem som PDF” eller del direkte til din mailapp.<\u002Fp>\n    <p style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(87,96,72,.10);color:#47503a;padding:9px 12px;border-radius:7px;display:inline-block;margin:14px 0 0\">{{ pdfFileName }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e2e0db;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.05);overflow:hidden;margin:0 0 18px\">\n    <div style=\"background:rgba(87,96,72,.09);border-bottom:1px solid #e2e0db;padding:15px 24px\">\n      <h2 style=\"font:700 20px/1.3 'Poppins',sans-serif;color:#3a3835;margin:0\">Det skal du sende med<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px\">\n      <p style=\"font:400 13.5px/1.5 'Poppins',sans-serif;color:#888580;margin:0 0 16px\">Listen bygger på dine svar i trin 4.<\u002Fp>\n      <ol style=\"list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:9px\">\n        <sc-for list=\"{{ checklist }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <li style=\"display:flex;gap:13px;align-items:flex-start;background:#faf9f7;border:1px solid #eae8e2;border-radius:11px;padding:13px 15px\">\n            <span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#576048;color:#fff;font:700 12px/1 'Poppins',sans-serif;margin-top:1px\">{{ c.num }}<\u002Fspan>\n            <span style=\"font:400 14.5px/1.55 'Poppins',sans-serif;color:#3a3835\">{{ c.text }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <a href=\"{{ mailtoHref }}\" style=\"display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:600 14.5px/1 'Poppins',sans-serif;background:#576048;color:#fff;border:1px solid #576048;border-radius:10px;padding:15px 22px;transition:background .15s ease-out\" style-hover=\"background:#47503a\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2.4\" y=\"3.8\" width=\"11.2\" height=\"8.4\" rx=\"1.6\"><\u002Frect><path d=\"M3 4.6l5 4 5-4\"><\u002Fpath><\u002Fsvg>\n        Send til {{ supportEmail }}\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:14px;align-items:flex-start;background:rgba(153,113,111,.14);border:1px solid rgba(153,113,111,.28);border-radius:16px;padding:22px;margin:0 0 18px\">\n    <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#725251\" sc-camel-stroke-width=\"1.4\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:2px\" aria-hidden=\"true\"><path d=\"M3.6 2.6h2l1 3-1.5 1a7.4 7.4 0 004.3 4.3l1-1.5 3 1v2a1.5 1.5 0 01-1.6 1.5C7 13.9 2.1 9 2.1 4.2a1.5 1.5 0 011.5-1.6z\"><\u002Fpath><\u002Fsvg>\n    <div>\n      <p style=\"font:700 16px/1.4 'Poppins',sans-serif;color:#3a3835;margin:0 0 5px\">Udfordringer?<\u002Fp>\n      <p style=\"font:400 14px/1.6 'Poppins',sans-serif;color:#3a3835;margin:0\">Skriv til <a href=\"{{ supportMailto }}\" style=\"color:#725251;font-weight:600\">{{ supportEmail }}<\u002Fa> eller ring til {{ supportName }} på {{ supportPhone }}.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font:400 13.5px/1.6 'Poppins',sans-serif;color:#888580;max-width:62ch;margin:0\">Når vi har modtaget besvarelsen, indkalder vi til en workshop på 1–2 timer, hvor vi gennemgår opsætningen.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:32px 0 0;padding:22px 0 0;border-top:1px solid #d9d6ce\">\n    <sc-if value=\"{{ canGoBack }}\" hint-placeholder-val=\"{{ true }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" style=\"display:inline-flex;align-items:center;gap:9px;font:600 14px/1 'Poppins',sans-serif;background:#fff;color:#3a3835;border:1px solid #dcd9d2;border-radius:10px;padding:13px 19px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:#f2f1ec\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12.5 8h-9M7 4.5L3.5 8 7 11.5\"><\u002Fpath><\u002Fsvg>\n        Tilbage\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"flex:1 1 20px\"><\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ saveDraft }}\" style=\"display:inline-flex;align-items:center;gap:9px;font:600 14px/1 'Poppins',sans-serif;background:#fff;color:#576048;border:1px solid #dcd9d2;border-radius:10px;padding:13px 19px;cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out\" style-hover=\"background:rgba(87,96,72,.08);border-color:#576048\">\n      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.5\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.4 3.4h7l2.2 2.2v7H3.4zM5.6 3.4v3.4h4.8V3.4M5.6 12.6V9.4h4.8v3.2\"><\u002Fpath><\u002Fsvg>\n      Gem kladde\n    <\u002Fbutton>\n    <sc-if value=\"{{ canGoNext }}\" hint-placeholder-val=\"{{ true }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"display:inline-flex;align-items:center;gap:10px;font:600 14.5px/1 'Poppins',sans-serif;background:#576048;color:#fff;border:none;border-radius:10px;padding:15px 25px;cursor:pointer;transition:background .15s ease-out\" style-hover=\"background:#47503a\">\n        Næste\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.6\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3.5 8h9M9 4.5L12.5 8 9 11.5\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ draftMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"font:500 13px/1.5 'Poppins',sans-serif;color:#576048;margin:14px 0 0;text-align:right\">{{ draftMsg }}<\u002Fp>\n  <\u002Fsc-if>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"elwb-print\" ref=\"{{ printRef }}\"><\u002Fdiv>\n\n<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onDraftFile }}\" ref=\"{{ fileRef }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\" sc-camel-tab-index=\"-1\" aria-hidden=\"true\">\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;supportEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;help@easyleave.dk&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kontakt&quot;},&quot;supportName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Simone&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kontakt&quot;},&quot;supportPhone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30 64 75 10&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kontakt&quot;},&quot;typeOverviewFrom&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:12,&quot;unit&quot;:&quot;typer&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ansættelsestyper&quot;}}\">\nclass Component extends DCLogic {\n  HOLIDAYS = [\"Nytårsdag\",\"Skærtorsdag\",\"Langfredag\",\"Påskedag\",\"2. påskedag\",\"1. maj\",\"Kristi Himmelfartsdag\",\"Fredag efter Kristi Himmelfartsdag\",\"Pinsedag\",\"2. pinsedag\",\"Grundlovsdag\",\"Juleaftensdag\",\"Juledag\",\"2. juledag\",\"Nytårsaftensdag\",\"Andet\"];\n  DEPTS = [\"Løn-afdeling\",\"Lønservice\",\"Løn\",\"HR\",\"People & Culture\",\"Andet\"];\n  MAILROWS = [{k:\"work\",label:\"Medarbejders arbejdsmail\"},{k:\"leader\",label:\"Leders mail\"},{k:\"private\",label:\"Medarbejders private mail\"}];\n  MAILCOLS = [\"Obligatorisk\",\"Valgfri\",\"Ej synlig\"];\n  YESNO = [\"Ja\",\"Nej\"];\n  PARENTS = [{k:\"mor\",label:\"Mor\"},{k:\"far\",label:\"Far/medmor\"}];\n  MATERIALS = [\n    {k:\"cba\",label:\"Overenskomster (én pr. ansættelsestype)\",deliver:\"Overenskomster — én fil pr. ansættelsestype, gerne navngivet med typens navn\"},\n    {k:\"handbook\",label:\"Personale- eller medarbejderhåndbog\",deliver:\"Personale-/medarbejderhåndbog\"},\n    {k:\"internal\",label:\"Interne retningslinjer\",deliver:\"Interne retningslinjer\"},\n    {k:\"templates\",label:\"Tidligere orlovsskabeloner (PDF eller Excel)\",deliver:\"Tidligere orlovsskabeloner\"},\n    {k:\"logo\",label:\"Virksomhedslogo i PNG eller SVG\",deliver:\"Virksomhedslogo i PNG eller SVG (helst med transparent baggrund)\"},\n    {k:\"other\",label:\"Andet\",deliver:\"Øvrigt materiale\"}\n  ];\n  STEP_NAMES = [\"Velkomst\",\"Indledende oplysninger\",\"Administratorer og adgang\",\"Ansættelsestyper\",\"Materiale\",\"Bemærkninger og feedback\",\"Aflevering\"];\n  MONTHS = [\"jan\",\"feb\",\"mar\",\"apr\",\"maj\",\"jun\",\"jul\",\"aug\",\"sep\",\"okt\",\"nov\",\"dec\"];\n  RATING_LABELS = [\"\",\"Meget svær\",\"Svær\",\"OK\",\"Nem\",\"Meget nem\"];\n  ACCENT = \"#576048\";\n  MISSING = \"#c2410c\";\n\n  newType(n) {\n    return {id:\"t\" + n + \"_\" + Math.random().toString(36).slice(2,7), name:\"\", uid:\"\", uidOther:\"\",\n      holidays:[], noHolidays:false, holidayOther:\"\",\n      mail:{work:\"\",leader:\"\",private:\"\"},\n      fixed:[{email:\"\",mode:\"\"},{email:\"\",mode:\"\"}],\n      hospital:{mor:\"\",far:\"\"}, partial:{mor:\"\",far:\"\"}};\n  }\n\n  constructor(props) {\n    super(props);\n    const t = this.newType(1);\n    this.state = {\n      step: 0, errors: {}, draftMsg: \"\",\n      open: {[t.id]: true},\n      copyOpen: null, copyQuery: \"\", confirmType: null,\n      data: {\n        contactName:\"\", companyName:\"\", dept:\"\", deptOther:\"\", deptEmail:\"\",\n        admins:[{name:\"\",email:\"\"}],\n        types:[t],\n        materials:[], materialOther:\"\", logo:\"\",\n        notes:\"\", rating:0, feedback:\"\"\n      }\n    };\n    this.fileRef = React.createRef();\n    this.printRef = React.createRef();\n  }\n\n  toTop() {\n    try { window.scrollTo(0, 0); } catch (e) {}\n    try { document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {}\n  }\n  afterStepChange() {\n    const ae = document.activeElement;\n    if (ae && ae !== document.body && ae.blur) ae.blur();\n    this.toTop();\n    setTimeout(() => {\n      this.toTop();\n      const el = document.querySelector(\"[data-autofocus='1']\");\n      if (el && el.focus) el.focus({preventScroll: true});\n      this.toTop();\n    }, 0);\n    setTimeout(() => this.toTop(), 60);\n    setTimeout(() => this.toTop(), 140);\n  }\n  gotoStep(n) {\n    this.setState({step: n, errors: {}, draftMsg: \"\", confirmType: null, copyOpen: null});\n    this.afterStepChange();\n  }\n\n  /* ── scroll/focus to a specific missing field ── */\n  scrollToErr(key) {\n    const el = (key && document.querySelector('[data-errkey=\"' + key + '\"]')) || document.querySelector(\"[data-errmsg]\");\n    if (!el) return;\n    const y = el.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0) - 150;\n    const top = Math.max(0, y);\n    try { window.scrollTo({top: top, behavior: \"smooth\"}); } catch (e) { window.scrollTo(0, top); }\n    const holder = el.closest ? el.closest(\"[data-field]\") : null;\n    const f = holder && holder.querySelector(\"input, textarea, select\");\n    if (f && f.focus) { try { f.focus({preventScroll: true}); } catch (e) {} }\n  }\n  jumpToErr(key) {\n    const m = String(key).match(/^types\\.(\\d+)\\./);\n    if (m) {\n      const t = this.state.data.types[+m[1]];\n      if (t) this.setState({open: {[t.id]: true}, confirmType: null, copyOpen: null});\n    }\n    setTimeout(() => this.scrollToErr(key), 60);\n  }\n\n  getP(path) { return path.split(\".\").reduce((o, k) => (o == null ? o : o[k]), this.state.data); }\n  setP(obj, path, val) {\n    const ks = path.split(\".\");\n    let o = obj;\n    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];\n    o[ks[ks.length - 1]] = val;\n  }\n  mutate(fn) {\n    this.setState(s => {\n      const nd = JSON.parse(JSON.stringify(s.data));\n      fn(nd);\n      return {data: nd, draftMsg: \"\"};\n    });\n  }\n  clearErr(key) {\n    if (!this.state.errors[key]) return;\n    this.setState(s => {\n      const e = Object.assign({}, s.errors);\n      delete e[key];\n      return {errors: e};\n    });\n  }\n  isEmail(v) { return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(String(v || \"\").trim()); }\n\n  typeHasData(t) {\n    return !!(t.name.trim() || t.uid || t.holidays.length || t.noHolidays || t.holidayOther.trim() ||\n      t.mail.work || t.mail.leader || t.mail.private ||\n      t.fixed.some(f => f.email.trim()) ||\n      t.hospital.mor || t.hospital.far || t.partial.mor || t.partial.far);\n  }\n\n  /* ── ONE spec drives both the \"x af 6\"-counter and the blocking validation ── */\n  typeChecks(t) {\n    return [\n      {key: \"name\", short: \"Navn\", label: \"a. Navn\",\n        ok: !!t.name.trim(),\n        msg: \"Giv typen et navn, så vi kan holde reglerne adskilt.\"},\n      {key: \"uid\", short: \"Unikt ID\", label: \"b. Unikt ID\",\n        ok: !!t.uid && (t.uid !== \"Andet\" || !!t.uidOther.trim()),\n        msg: t.uid === \"Andet\" ? \"Skriv hvilket ID I bruger.\" : \"Vælg hvad der entydigt identificerer medarbejderne.\"},\n      {key: \"holidays\", short: \"Helligdage\", label: \"c. Helligdage\",\n        ok: t.noHolidays ? true : (t.holidays.length > 0 && (t.holidays.indexOf(\"Andet\") < 0 || !!t.holidayOther.trim())),\n        msg: (!t.noHolidays && t.holidays
